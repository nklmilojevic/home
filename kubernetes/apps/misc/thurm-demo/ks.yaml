---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app thurm-demo
spec:
  components:
    - ../../../../components/kopiur/volume
    - ../../../../components/kopiur/backup
  targetNamespace: misc
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
    - name: external-secrets-stores
      namespace: security
  path: ./kubernetes/apps/misc/thurm-demo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      APP_UID: "1000"
      APP_GID: "1000"
      KOPIUR_CLAIM: thurm-demo
      KOPIUR_CAPACITY: 1Gi
