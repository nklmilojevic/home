---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thurm-demo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: thurm-demo
  values:
    defaultPodOptions:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      thurm-demo:
        strategy: Recreate
        pod:
          imagePullSecrets:
            - name: thurm-demo-ghcr-credentials
        containers:
          app:
            image:
              repository: ghcr.io/nklmilojevic/thurm-demo
              tag: sha-54a703e@sha256:41c2e2c68e9bd71eedc8bf0bbf24e5f48194d26fec2ac8beaa70aecd1486d124
            env:
              TZ: "Europe/Belgrade"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 2222
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: thurm-demo
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.40.0.18"
        ports:
          ssh:
            port: *port

    persistence:
      data:
        existingClaim: thurm-demo
        globalMounts:
          - path: /data
      home:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /home/demo
      tmp:
        type: emptyDir
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
