---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: stirling-pdf

  values:
    controllers:
      stirling-pdf:
        containers:
          app:
            securityContext:
              allowPrivilegeEscalation: false
            image:
              repository: ghcr.io/stirling-tools/s-pdf
              tag: 3.3.0@sha256:ed7b1775c6706b5e5ea24fa6155f078eff1027bd35a17d21834e4407036025e6
            env:
              TZ: "Europe/Belgrade"
              DOCKER_ENABLE_SECURITY: "false"
              SECURITY_ENABLE_LOGIN: "false"
            resources:
              requests:
                cpu: 10m
                memory: 1536Mi
              limits:
                memory: 3Gi

    service:
      app:
        controller: stirling-pdf
        ports:
          http:
            port: &port 8080

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.nikola.wtf"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: stirling-pdf
                port: *port

    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /configs
      tessdata:
        type: emptyDir
        globalMounts:
          - path: /usr/share/tessdata
