---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: invoicing
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: invoicing
  values:
    controllers:
      invoicing:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/nklmilojevic/invoicing
              tag: sha-976dece@sha256:96115330ad7a0a1222e68d3e8549ee5b4ee2b0d575c915c106739d5af1b7dac3
            env:
              TZ: "Europe/Belgrade"
              DATABASE_URL: "file:/app/data/invoicing.db"
            envFrom:
              - secretRef:
                  name: invoicing-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              # First start backs up the database and checks migrations
              # before serving; give it up to 150s before liveness applies.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: invoicing
        ports:
          http:
            port: &port 3000

    route:
      app:
        hostnames:
          - &hostName invoicing.nikola.wtf
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: invoicing
                port: *port

    persistence:
      data:
        existingClaim: invoicing
        advancedMounts:
          invoicing:
            app:
              - path: /app/data
