---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoicing-ghcr
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: ghcr-credentials
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoicing
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: invoicing-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Encrypts the SMTP password and Telegram bot token stored in the
        # app's SQLite database.
        ENCRYPTION_KEY: "{{ .password }}"
  dataFrom:
    - extract:
        key: invoicing
