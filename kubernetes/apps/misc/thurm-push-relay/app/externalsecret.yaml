---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thurm-push-relay-ghcr
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: thurm-push-relay-ghcr-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: ghcr-credentials
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thurm-push-relay
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: thurm-push-relay-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Device registration code.
        THURM_RELAY_CODE: "{{ .THURM_RELAY_CODE }}"
        # APNs token auth (.p8 key).
        APNS_KEY: "{{ .APNS_KEY }}"
        APNS_KEY_ID: "{{ .APNS_KEY_ID }}"
        APNS_TEAM_ID: "{{ .APNS_TEAM_ID }}"
  dataFrom:
    - extract:
        key: thurm-push-relay
