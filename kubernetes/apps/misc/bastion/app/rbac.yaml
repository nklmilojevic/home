---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bastion-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: bastion
    namespace: misc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bastion
rules:
  - apiGroups:
      - ""
    resources:
      - "nodes"
      - "namespaces"
      - "persistentvolumes"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - "metrics.k8s.io"
    resources:
      - "nodes"
      - "pods"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "apiextensions.k8s.io"
    resources:
      - "customresourcedefinitions"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - acme.cert-manager.io
      - barmancloud.cnpg.io
      - cert-manager.io
      - cilium.io
      - external-secrets.io
      - externaldns.k8s.io
      - fluxcd.controlplane.io
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - gateway.networking.x-k8s.io
      - generators.external-secrets.io
      - grafana.integreatly.org
      - groupsnapshot.storage.k8s.io
      - helm.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - k8s.cni.cncf.io
      - kopiur.home-operations.com
      - kustomize.toolkit.fluxcd.io
      - miroir.home-operations.com
      - monitoring.coreos.com
      - notification.toolkit.fluxcd.io
      - onepassword.com
      - operator.victoriametrics.com
      - populator.storage.k8s.io
      - postgresql.cnpg.io
      - redis.redis.opstreelabs.in
      - renovate-operator.mogenius.com
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - talos.dev
      - toolhive.stacklok.dev
      - tuppr.home-operations.com
    resources:
      - "*"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - ""
    resources:
      - "pods"
    verbs:
      - "delete"
  - apiGroups:
      - ""
    resources:
      - "pods/exec"
      - "pods/portforward"
    verbs:
      - "create"
  - apiGroups:
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
    resources:
      - "*"
    verbs:
      - "patch"
  - apiGroups:
      - "kopiur.home-operations.com"
    resources:
      - "snapshots"
    verbs:
      - "create"
      - "delete"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bastion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bastion
subjects:
  - kind: ServiceAccount
    name: bastion
    namespace: misc
