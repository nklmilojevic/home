---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bastion-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: bastion-secret
    template:
      engineVersion: v2
      data:
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        GH_TOKEN: "{{ .GH_TOKEN }}"
        # Pi holds no provider credentials. These are the shared secrets of the
        # two in-cluster proxies: LiteLLM for ChatGPT and API-key providers,
        # Meridian for the Claude subscription.
        LITELLM_API_KEY: "{{ .LITELLM_API_KEY }}"
        MERIDIAN_API_KEY: "{{ .MERIDIAN_API_KEY }}"
  dataFrom:
    - extract:
        key: bastion
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: MERIDIAN_API_KEY
      remoteRef:
        key: litellm
        property: meridian_api_key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bastion-talosconfig
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: bastion-talosconfig
    template:
      engineVersion: v2
      data:
        talosconfig: "{{ .TALOSCONFIG }}"
  dataFrom:
    - extract:
        key: bastion
