---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donnie-push-ghcr
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: donnie-push-ghcr-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: ghcr-credentials
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donnie-push
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: donnie-push-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Encrypts stored Google refresh tokens; signs Google watch-channel tokens.
        TOKEN_ENCRYPTION_KEY: "{{ .TOKEN_ENCRYPTION_KEY }}"
        CHANNEL_SECRET: "{{ .CHANNEL_SECRET }}"
        # APNs token auth (.p8 key) for the DonnieCalendarko apps.
        APNS_KEY: "{{ .APNS_KEY }}"
        APNS_KEY_ID: "{{ .APNS_KEY_ID }}"
        APNS_TEAM_ID: "{{ .APNS_TEAM_ID }}"
  dataFrom:
    - extract:
        key: donnie-push
