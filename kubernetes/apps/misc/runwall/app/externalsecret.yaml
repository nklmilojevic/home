---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runwall-ghcr
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: runwall-ghcr-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: ghcr-credentials
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runwall
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: runwall-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # GitHub App credentials, sign-in client, and the key that encrypts
        # sessions and stored user tokens.
        GITHUB_APP_ID: "{{ .app_id }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .private_key }}"
        GITHUB_WEBHOOK_SECRET: "{{ .webhook_secret }}"
        GITHUB_CLIENT_ID: "{{ .client_id }}"
        GITHUB_CLIENT_SECRET: "{{ .client_secret }}"
        SESSION_KEY: "{{ .session_key }}"
  dataFrom:
    - extract:
        key: runwall
