---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runwall
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: runwall
  values:
    controllers:
      runwall:
        # SQLite on a ReadWriteOnce volume: exactly one pod, never two at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          imagePullSecrets:
            - name: runwall-ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/nklmilojevic/runwall
              tag: sha-a38d286@sha256:97347cf2ae3b09a474241a16961f43b2e27e9ef8c1eefe9870c81b67c351ea8d
            env:
              TZ: "Europe/Belgrade"
              LISTEN_ADDR: :8080
              BASE_URL: https://runwall.nikola.wtf
              DB_PATH: /data/runwall.db
              NOTIFIER: log
              # The App is private to this account; ignore installations anywhere else.
              ALLOWED_ACCOUNTS: nklmilojevic
            envFrom:
              - secretRef:
                  name: runwall-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: runwall
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          # / redirects to the GitHub sign-in; probe the health endpoint instead.
          gatus.home-operations.com/endpoint: |
            url: https://runwall.nikola.wtf/healthz
        hostnames:
          - runwall.nikola.wtf
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: runwall
                port: *port
      # GitHub delivers webhooks here. Only /webhook is public; every delivery is
      # checked against the App's webhook secret.
      webhook:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - runwall-webhook.nikola.wtf
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  value: /webhook
            backendRefs:
              - name: runwall
                port: *port

    persistence:
      data:
        existingClaim: runwall
        advancedMounts:
          runwall:
            app:
              - path: /data
