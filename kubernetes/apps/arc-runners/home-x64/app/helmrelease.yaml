---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-x64
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: home-x64
  values:
    githubConfigUrl: https://github.com/nklmilojevic/thurm
    githubConfigSecret: home-x64-github-app
    runnerScaleSetName: home-x64
    minRunners: 0
    maxRunners: 2
    controllerServiceAccount:
      namespace: arc-systems
      name: actions-runner-controller
    containerMode:
      type: kubernetes-novolume
    listenerTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    template:
      spec:
        serviceAccountName: home-x64-runner
        enableServiceLinks: false
        priorityClassName: arc-runner
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.0
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                value: /home/runner/hook-template/job-pod.yaml
              - name: ACTIONS_RUNNER_KUBERNETES_NAMESPACE
                value: arc-jobs
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            volumeMounts:
              - name: hook-template
                mountPath: /home/runner/hook-template
                readOnly: true
        volumes:
          - name: hook-template
            configMap:
              name: home-x64-hook-template
