---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: redis-exporter
spec:
  namespaceSelector:
    matchNames:
      - database
  podMetricsEndpoints:
    - port: redis-exporter
  selector:
    matchLabels:
      redis_setup_type: standalone
