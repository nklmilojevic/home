---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ot-operator
  labels:
    flux.home/helm-defaults: skip
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: ot-operator
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    # Upstream re-pushed the 0.25.0 chart with an AvoidCommandLinePassword
    # feature gate the v0.25.0 image binary does not know; null-delete it
    # until a chart/image pair >=0.26.0 is published.
    featureGates:
      AvoidCommandLinePassword: null
    manager:
      config:
        kubeClientTimeout: ""
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
