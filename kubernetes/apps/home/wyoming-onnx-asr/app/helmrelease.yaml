---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wyoming-onnx-asr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: wyoming-onnx-asr
  values:
    controllers:
      wyoming-onnx-asr:
        containers:
          app:
            image:
              repository: ghcr.io/tboby/wyoming-onnx-asr
              tag: v0.5.0
            args:
              # --model-en instead of --model-multilingual: upstream _LANGUAGE_CODES
              # omits "en", so HA grays the engine out for English pipelines
              - --model-en
              - nemo-parakeet-tdt-0.6b-v3
              - --quantization
              - int8
              - --uri
              - tcp://0.0.0.0:10300
            env:
              TZ: Europe/Belgrade
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 3Gi
    service:
      app:
        controller: *app
        ports:
          asr:
            enabled: true
            primary: true
            port: 10300
            protocol: TCP
    persistence:
      data:
        enabled: true
        existingClaim: *app
