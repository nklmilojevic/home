---
apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
  annotations:
    volsync.backube/privileged-movers: "true"
    # otbr, matter-server and music-assistant back up as uid 0 (APP_UID "0"
    # in their ks.yaml), and kopiur fails closed on an elevated mover until
    # the namespace opts in — the volsync twin above.
    kopiur.home-operations.com/privileged-movers: "true"
