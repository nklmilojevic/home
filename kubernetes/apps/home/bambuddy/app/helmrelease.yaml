---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: bambuddy
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      bambuddy:
        strategy: Recreate
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-host",
                "namespace": "network",
                "ips": ["10.5.0.243/24"],
                "mac": "02:05:00:00:00:f3"
              }]
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.2.5.5
            env:
              TZ: Europe/Belgrade
              PORT: &port 8000
            probes:
              liveness: &health
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *health
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                # The image's Python binary carries this file capability.
                # It must remain in the bounding set or exec fails with EPERM.
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL
      slicer:
        strategy: Recreate
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              tag: bambuddy-1.2.5.5
            env:
              TZ: Europe/Belgrade
              NODE_ENV: production
              PORT: &slicerPort 3000
              DATA_PATH: /app/data
              HOME: /tmp
              XDG_CONFIG_HOME: /tmp/.config
              XDG_CACHE_HOME: /tmp/.cache
              MAX_MODEL_UPLOAD_MB: "512"
            probes:
              liveness: &slicerHealth
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *slicerPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *slicerHealth
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *slicerPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: bambuddy
        ports:
          http:
            port: *port
            appProtocol: kubernetes.io/ws
      slicer:
        controller: slicer
        ports:
          http:
            port: *slicerPort
    route:
      app:
        hostnames:
          - bambuddy.nikola.wtf
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: bambuddy-config
        advancedMounts:
          bambuddy:
            app:
              - path: /app/data
      logs:
        type: emptyDir
        advancedMounts:
          bambuddy:
            app:
              - path: /app/logs
      tmp:
        type: emptyDir
        advancedMounts:
          bambuddy:
            app:
              - path: /tmp
          slicer:
            app:
              - path: /tmp
      slicer-data:
        type: emptyDir
        sizeLimit: 10Gi
        advancedMounts:
          slicer:
            app:
              - path: /app/data
