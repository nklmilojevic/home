---
log:
  streams: error # UniFi Protect based setups spam the logs with WARN messages
api:
  listen: :80
rtsp:
  listen: :554
webrtc:
  listen: :8555
  candidates:
    - 10.40.0.29:8555
    - stun:8555
  ice_servers:
    - urls:
        - stun:stun.cloudflare.com:3478
streams:
  terrace:
    - rtspx://10.5.0.1:7441/KAfuuAzB5GlC2seV
  entrance:
    - rtspx://10.5.0.1:7441/7h9l4fCP4Ekos4KY
  # DT intercom door station via vtk-proxy (asterisk pod). The tap session
  # starts on first stream open and ends when ffmpeg disconnects. Audio is a
  # second source: the monitor relays the door station mic as raw G.711 µ-law
  # (8kHz mono, no container), so the input format has to be stated outright --
  # hence an explicit exec pipeline rather than the ffmpeg: source, whose
  # #input= handling would have to be taken on trust. Opus because the consumer
  # is the WebRTC card.
  intercom_ds1:
    - ffmpeg:http://asterisk.home.svc.cluster.local:8851/video?ds=1#video=copy
    - >-
      exec:ffmpeg -hide_banner -loglevel error
      -f mulaw -ar 8000 -ac 1
      -i http://asterisk.home.svc.cluster.local:8851/audio?ds=1
      -c:a libopus -application lowdelay -ar 48000 -ac 1
      -f rtsp {output}
