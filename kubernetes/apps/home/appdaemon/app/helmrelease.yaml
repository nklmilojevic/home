---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: appdaemon
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: appdaemon
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      appdaemon:
        annotations:
          secret.reloader.stakater.com/reload: "appdaemon-secrets"

        replicas: 1

        containers:
          app:
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
            image:
              repository: docker.io/acockburn/appdaemon
              tag: 4.5.16@sha256:e221331ca98c19558b9e7838e2187e63d5c900eebfd0804a6cba4b1596782420
            env:
              HA_URL: "http://home-assistant-app:8123"
              DASH_URL: "http://0.0.0.0:5050"
            envFrom:
              - secretRef:
                  name: appdaemon-secrets
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

    service:
      app:
        controller: &app appdaemon
        ports:
          http:
            port: &port 5050

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.nikola.wtf"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      conf:
        existingClaim: "{{ .Release.Name }}-config"
