---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: govee2mqtt
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: govee2mqtt
  values:
    controllers:
      govee2mqtt:
        replicas: 1

        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "network",
                "ips": ["10.50.0.250/24"],
                "mac": "7e:84:d7:6e:5e:13"
              }]
        containers:
          app:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            image:
              repository: ghcr.io/wez/govee2mqtt
              tag: 2025.01.04-abbd0b48@sha256:954a77361dd846ab468a4934d579c784416f2cd7c177ce183249e8a62ae2ad99
              pullPolicy: IfNotPresent
            env:
              GOVEE_MQTT_HOST: "mosquitto.home.svc"
              GOVEE_LAN_BROADCAST_ALL: "true"
            envFrom:
              - secretRef:
                  name: govee2mqtt-secret
            securityContext:
              privileged: true

    persistence:
      data:
        existingClaim: govee2mqtt-config
