---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: petkit-local-media-local
spec:
  # kopiur twin of the `petkit-local-media-local` ReplicationSource next to this file. This volume
  # sits outside the volsync/kopiur Components (it is a standalone pvc.yaml), so it needs an
  # explicit policy — the component only ever covers ${VOLSYNC_CLAIM}. This is
  # the class of volume whose backup was missed in the 2026-08-04 cutover.
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: 2Gi
      mode: Persistent
      storageClassName: openebs-hostpath
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  repository:
    kind: ClusterRepository
    name: local
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
  staging:
    timeout: 30m
  sources:
    - pvc:
        name: petkit-local-media
  volumeSnapshotClassName: csi-ceph-blockpool
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: petkit-local-media-local
spec:
  policyRef:
    name: petkit-local-media-local
  schedule:
    cron: "0 * * * *"
    timezone: Europe/Belgrade
