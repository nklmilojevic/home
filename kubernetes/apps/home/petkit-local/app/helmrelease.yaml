---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app petkit-local
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: petkit-local
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      petkit-local:
        containers:
          app:
            image:
              repository: quay.io/nklmilojevic/petkit-local
              # Built from the nklmilojevic/petkit-local fork (containers#442),
              # carrying the D4H fixes: BLE provisioning, camera feeder IP,
              # desiccant countdown, battery-installed. The containers pipeline
              # strips the fork's -nkl.N prerelease suffix, so the image tag is
              # still 1.6.0 (mutated in place) — the digest is what forces the
              # re-pull and pins exactly the fork build. Back to a plain upstream
              # tag once the fixes land upstream (PRs alex-so-3#11/#12).
              tag: 1.6.0@sha256:5b871a38352e80e2cb4a474be480bd5906aa55a225700fdaecec89c12a2b1173
            args:
              # The device is handed only the api-url host for MQTT and media
              # uploads, on firmware-fixed ports (443/9000) — so this must stay
              # the LoadBalancer IP, and the MQTT TLS listener is remapped from
              # 443 by the Service so the pod never binds a privileged port.
              - --data-dir=/data
              - --port=8080
              - --api-url=http://10.40.0.33/6/
              - --mqtt-tls
              - --mqtt-tls-port=8443
              - --ha-mqtt-host=mosquitto.home.svc.cluster.local
              - --ha-mqtt-port=1883
            env:
              TZ: "Europe/Belgrade"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &panel-port 8099
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: petkit-local
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.40.0.33"
        ports:
          http:
            port: 80
            targetPort: 8080
          mqtts:
            port: 443
            targetPort: 8443
          media:
            port: 9000
          rtsp:
            port: 8554
          panel:
            port: *panel-port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.nikola.wtf"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *panel-port
    persistence:
      config:
        existingClaim: petkit-local-config
        globalMounts:
          - path: /data
      media:
        existingClaim: petkit-local-media
        globalMounts:
          - path: /media/petkit
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
