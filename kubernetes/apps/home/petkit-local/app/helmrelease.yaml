---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app petkit-local
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: petkit-local
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      petkit-local:
        containers:
          app:
            image:
              repository: quay.io/nklmilojevic/petkit-local
              # Fork build (nklmilojevic/petkit-local, v2.1.0-nkl.2) — upstream
              # v2.1.0 plus both open upstream PRs: the K3 HTTP piggyback fix
              # (alex-so-3/petkit-local#28, half of #21): a T4's unpatchable
              # ESP32 can't do MQTT, so the K3 spray's battery/liquid never
              # reached the bridge — the HTTP path now extracts them from
              # dev_state_report/dev_event_report state blocks; and the D4H
              # food-low derivation (#27): Food Low derived from hopper
              # presence instead of the inverted raw flag. Revert to plain
              # upstream once #21/#27 land. Other known remaining gaps vs the
              # retired D4H fork: feedState totals reset on restart (nkl.12),
              # battery_installed removed (nkl.3).
              tag: 2.1.0@sha256:2c1b404bd02075473487a67dcb95db7cda973e8a6023c680a1a468b82da50518
            args:
              # The device is handed only the api-url host for MQTT and media
              # uploads, on firmware-fixed ports (443/9000) — so this must stay
              # the LoadBalancer IP, and the MQTT TLS listener is remapped from
              # 443 by the Service so the pod never binds a privileged port.
              #
              # ESP32 devices (T4 Pura Max) additionally need TWO UniFi-side
              # things or they silently rejoin PetKit's real cloud (their
              # stored Aliyun registration stays valid, so the cloud MQTT auth
              # SUCCEEDS and they never fall back to our HTTP heartbeat):
              #   1. Static DNS: *.petkt.com, *.petkit.com, *.eu-pet.com,
              #      *.petktasia.com and a54dw3GX0NZ.iot-as-mqtt.eu-central-1
              #      .aliyuncs.com -> 10.40.0.33
              #   2. Zone firewall policy "Block Petkit T4 to Internet"
              #      (IoT client cc:db:a7:88:f5:b8 -> External, BLOCK)
              # Diagnosed live 2026-08-16: with both in place the T4 runs
              # ota_check/signup/iot against us, fails our TLS broker (ESP32
              # is unpatchable), and settles into ~11s HTTP heartbeat polling,
              # which is the transport that carries its commands.
              - --data-dir=/data
              - --port=8080
              - --api-url=http://10.40.0.33/6/
              - --mqtt-tls
              - --mqtt-tls-port=8443
              - --ha-mqtt-host=mosquitto.home.svc.cluster.local
              - --ha-mqtt-port=1883
            env:
              TZ: "Europe/Belgrade"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &panel-port 8099
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: petkit-local
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.40.0.33"
        ports:
          http:
            port: 80
            targetPort: 8080
          mqtts:
            port: 443
            targetPort: 8443
          media:
            port: 9000
          rtsp:
            port: 8554
          panel:
            port: *panel-port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.nikola.wtf"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *panel-port
    persistence:
      config:
        existingClaim: petkit-local-config
        globalMounts:
          - path: /data
      media:
        existingClaim: petkit-local-media
        globalMounts:
          - path: /media/petkit
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
