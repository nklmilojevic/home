---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app petkit-local
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: petkit-local
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      petkit-local:
        containers:
          app:
            image:
              repository: quay.io/nklmilojevic/petkit-local
              # Pinned to the digest of the 1.6.0 build carrying the D4H BLE
              # provisioning fix (containers#440). The overlay mutates the 1.6.0
              # tag in place, so the digest is what forces a re-pull. Drop the
              # digest (back to a plain tag) once the fix is upstream.
              tag: 1.6.0@sha256:8175ba07b98591528dd10c300e81d409b4de9a2e384f0766c8b29a9891b80c66
            args:
              # The device is handed only the api-url host for MQTT and media
              # uploads, on firmware-fixed ports (443/9000) — so this must stay
              # the LoadBalancer IP, and the MQTT TLS listener is remapped from
              # 443 by the Service so the pod never binds a privileged port.
              - --data-dir=/data
              - --port=8080
              - --api-url=http://10.40.0.33/6/
              - --mqtt-tls
              - --mqtt-tls-port=8443
              - --ha-mqtt-host=mosquitto.home.svc.cluster.local
              - --ha-mqtt-port=1883
            env:
              TZ: "Europe/Belgrade"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &panel-port 8099
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: petkit-local
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.40.0.33"
        ports:
          http:
            port: 80
            targetPort: 8080
          mqtts:
            port: 443
            targetPort: 8443
          media:
            port: 9000
          rtsp:
            port: 8554
          panel:
            port: *panel-port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.nikola.wtf"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *panel-port
    persistence:
      config:
        existingClaim: petkit-local-config
        globalMounts:
          - path: /data
      media:
        existingClaim: petkit-local-media
        globalMounts:
          - path: /media/petkit
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
