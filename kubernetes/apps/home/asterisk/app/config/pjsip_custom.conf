; Custom PJSIP config for DVC DX470 Intercom

[640000033c9b]
type=endpoint
context=from-intercom
disallow=all
allow=g722
allow=alaw
allow=ulaw
allow=h264
aors=640000033c9b
auth=640000033c9b-auth,6e0000033c9b-auth
callerid="Door Intercom" <8000>
direct_media=no
dtmf_mode=info
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
ice_support=no

[640000033c9b]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
; Cap registration expiry so the monitor re-registers within 2 minutes
; after an Asterisk restart (it defaults to a 3600s registration).
maximum_expiration=120

[640000033c9b-auth]
type=auth
auth_type=userpass
username=640000033c9b
password=49115

; Divert account the monitor uses when forwarding door calls to SIP
; ("Nalog za preusmerenje" on the DX470 SIP config page)
[6e0000033c9b-auth]
type=auth
auth_type=userpass
username=6e0000033c9b
password=15377

[640000033c9b-identify]
type=identify
endpoint=640000033c9b
match=10.50.0.190

; Browser phone (phone.nikola.wtf) — SIP.js over wss, reuses the
; add-on's sipjs templates from pjsip_default.conf (password hass123)
[101](sipjs-phone-aor)
[101](sipjs-phone-auth)
username=101
[101](sipjs-phone-endpoint)
aors=101
auth=101
callerid="Browser Phone" <101>
