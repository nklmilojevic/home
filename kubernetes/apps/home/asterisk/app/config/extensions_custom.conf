; Full extensions.conf replacement for intercom support

[general]
static=yes

[default]
include => parkedcalls

; Door intercom - must be before catch-all
exten => 8000,1,NoOp(Calling Door Intercom)
 same => n,Dial(PJSIP/640000033c9b,60)
 same => n,Hangup()

; Tap into the door camera on demand: calling the monitor with request-URI
; user 1000 ("šifra udaljenog monitora") makes it auto-answer and relay the
; door station video/audio instead of ringing.
exten => 1000,1,NoOp(Monitoring Door Camera)
 same => n,Dial(PJSIP/1000@640000033c9b,30)
 same => n,Hangup()

; Park extensions
exten => 444,1,Park(,s)
exten => 555,1,ParkedCall(default,701)

; Catch-all for other extensions
exten => _X!,1,Dial($${PJSIP_DIAL_CONTACTS($${EXTEN})})

[parkedcallstimeout]
exten => s,1,Hangup()

[from-intercom]
; When intercom calls (divert), ring HA (100) and the browser phone (101)
exten => _X.,1,NoOp(Incoming call from Door Intercom to $${EXTEN})
 same => n,Set(CALLERID(name)=Door Intercom)
 same => n,Set(CALLERID(num)=8000)
 same => n,Dial(PJSIP/100&PJSIP/101,60)
 same => n,Hangup()
