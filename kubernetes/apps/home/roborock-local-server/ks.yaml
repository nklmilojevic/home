---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app roborock-local-server
spec:
  components:
    - ../../../../components/volsync
    - ../../../../components/kopiur/backup
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cert-manager-issuers
      namespace: cert-manager
    - name: volsync
      namespace: security
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: external-secrets-stores
      namespace: security
  path: ./kubernetes/apps/home/roborock-local-server/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      VOLSYNC_SCHEDULE: "55 0 * * *"
      VOLSYNC_LOCAL_SCHEDULE: "55 3 * * *"
      APP: *app
      VOLSYNC_CLAIM: roborock-local-server-data
      VOLSYNC_CAPACITY: 2Gi
      APP_UID: "1000"
      APP_GID: "1000"
