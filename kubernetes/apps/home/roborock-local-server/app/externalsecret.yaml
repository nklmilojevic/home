---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roborock-local-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: roborock-local-server-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.toml: |
          [network]
          stack_fqdn = "api-rr.nikola.wtf"
          listener_mode = "local_tls"
          bind_host = "0.0.0.0"
          https_port = 555
          mqtt_tls_port = 8881
          region = "eu"

          [broker]
          mode = "embedded"
          host = "127.0.0.1"
          port = 18830
          mosquitto_binary = "mosquitto"
          enable_topic_bridge = true

          [storage]
          data_dir = "/data"

          [tls]
          mode = "provided"
          cert_file = "/cert/tls.crt"
          key_file = "/cert/tls.key"

          [admin]
          password_hash = "{{ .ADMIN_PASSWORD_HASH }}"
          session_secret = "{{ .SESSION_SECRET }}"
          session_ttl_seconds = 86400
          protocol_auth_enabled = true
          new_connections_enabled = true
          protocol_login_email = "{{ .PROTOCOL_LOGIN_EMAIL }}"
          protocol_login_pin_hash = "{{ .PROTOCOL_LOGIN_PIN_HASH }}"
  dataFrom:
    - extract:
        key: roborock-local-server
