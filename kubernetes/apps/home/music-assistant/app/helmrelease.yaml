---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: music-assistant

  values:
    controllers:
      music-assistant:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # Most of /data is still owned by uid 65532 from an earlier non-root era of
          # this app (fsGroup 0 keeps it writable, which is why it went unnoticed).
          # Since 2.10.0 the server hardens its WebRTC key with fchmod on startup,
          # and chmod of a file owned by another uid needs CAP_FOWNER, which the app
          # container drops -> EPERM -> crash loop. Take ownership instead of handing
          # the long-running container the capability. Also re-fixes ownership after a
          # VolSync restore, whose restic snapshots carry the old uid.
          01-fix-permissions:
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - |
                set -eu
                chown -R 0:0 /data
            securityContext:
              allowPrivilegeEscalation: false
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        pod:
          # Music Assistant relies on mDNS/UPnP (SSDP) to discover and stream to
          # players (Chromecast, AirPlay, Sonos, DLNA renderers like the Denon
          # AVR). Those are L2-broadcast based, so the pod needs an interface on
          # the IoT VLAN where the players live, mirroring matter-server/otbr.
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "network",
                "ips": ["10.50.0.244/24"],
                "mac": "7e:84:d7:6e:5e:15"
              }]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.1@sha256:e6edefe825b1cdc50223c16d9bc2fca909a158b36555a7763512b76ba04a1b9e
            env:
              TZ: Europe/Belgrade
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8095
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: music-assistant
        ports:
          http:
            port: *port
          stream:
            port: 8097

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.nikola.wtf"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: music-assistant
                port: *port

    persistence:
      data:
        existingClaim: music-assistant-data
        globalMounts:
          - path: /data
      media:
        type: custom
        volumeSpec:
          nfs:
            server: "10.5.0.10"
            path: "/var/nfs/shared/media"
        globalMounts:
          - path: "/media"
      tmp:
        type: emptyDir
