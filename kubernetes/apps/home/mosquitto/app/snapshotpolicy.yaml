---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: mosquitto
spec:
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: 1Gi
      mode: Persistent
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  repository:
    kind: ClusterRepository
    name: r2
  retention:
    keepLatest: 3
    keepDaily: 7
  sources:
    - pvc:
        name: mosquitto-data
  volumeSnapshotClassName: miroir
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: mosquitto
spec:
  policyRef:
    name: mosquitto
  schedule:
    cron: "H 0 * * *"
    timezone: Europe/Belgrade
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: mosquitto
spec:
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: mosquitto
      offset: 0
  target:
    populator: {}
