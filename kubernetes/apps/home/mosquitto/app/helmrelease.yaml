---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: mosquitto
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      mosquitto:
        annotations:
          configmap.reloader.stakater.com/reload: "mosquitto"
          secret.reloader.stakater.com/reload: "mosquitto-vesync-tls"
        containers:
          app:
            image:
              repository: eclipse-mosquitto
              tag: 2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
            env:
              TZ: "Europe/Belgrade"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 100Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: mosquitto
        # keep the historical service name now that a second service exists
        forceRename: mosquitto
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.40.0.8"
          external-dns.alpha.kubernetes.io/hostname: mqtt.nikola.wtf
        ports:
          http:
            port: 1883
      # VeSync/Levoit devices dial vdmpmqtt.vesync.com:1883 speaking TLS and
      # skip certificate validation, so a self-signed cert on a dedicated LB IP
      # (DNS-rewritten in UniFi) captures them locally.
      vesync:
        controller: mosquitto
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.40.0.35"
        ports:
          mqtts:
            port: 1883
            targetPort: 8883
          mqtts-alt:
            port: 8883
            targetPort: 8883
          mqtts-https:
            port: 443
            targetPort: 8883

    configMaps:
      config:
        data:
          mosquitto.conf: |
            allow_anonymous true
            autosave_interval 60
            connection_messages false
            listener 1883
            per_listener_settings false
            persistence true
            persistence_location /data
            listener 8883
            certfile /tls/tls.crt
            keyfile /tls/tls.key

    persistence:
      data:
        existingClaim: mosquitto-data
      tls:
        type: secret
        name: mosquitto-vesync-tls
        globalMounts:
          - path: /tls
            readOnly: true
      config-file:
        type: configMap
        name: mosquitto
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/config/mosquitto.conf
                subPath: mosquitto.conf
