---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: mosquitto-local
spec:
  # kopiur twin of the `mosquitto-local` ReplicationSource next to this file. This volume
  # sits outside the volsync/kopiur Components (it is a standalone pvc.yaml), so it needs an
  # explicit policy — the component only ever covers ${VOLSYNC_CLAIM}. This is
  # the class of volume whose backup was missed in the 2026-08-04 cutover.
  compression:
    compressor: zstd
  mover:
    # Ephemeral, NOT Persistent: a persistent cache is a node-local PVC that
    # binds once and pins the mover to that node forever. That broke backups
    # twice on 2026-08-30 -- 80 caches stranded when icarus003 went down, then
    # hermes deadlocked with its cache on icarus003 and its staging clone on
    # icarus001, so no node could satisfy both. Staging clones can only land on
    # diskful nodes; caches can land anywhere, so the two drift apart.
    # Costs a kopia metadata re-download per run; over the LAN that is cheap
    # next to a backup that cannot schedule at all.
    cache:
      capacity: 2Gi
      mode: Ephemeral
      storageClassName: openebs-hostpath
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
  repository:
    kind: ClusterRepository
    name: local
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
  staging:
    # miroir, NOT miroir-local. A single-replica clone is pinned to one node and
    # only usable there, so the mover -- which needs the clone and its kopia
    # cache on ONE node -- is unschedulable whenever the two land apart:
    # "3 node(s) didn't match PersistentVolume's node affinity", forever, with
    # nothing to time it out. The component policies were moved to the
    # replicated class on 2026-08-31; these hand-written ones were missed, which
    # is why gatus, victorialogs, jellyfin-metadata, home-assistant-media and
    # vmsingle-health kept failing after the fleet-wide fix appeared to work.
    #
    # This reverses the note that staging needs no replication: that was about
    # the chart default of 3 replicas, where every clone touched all three nodes
    # so one degraded agent failed the whole fleet and the per-snapshot LVM/DRBD
    # work drove the 2026-08-29 OOM. 2 replicas keeps a spare leg without
    # putting every clone on every node.
    storageClassName: miroir
    timeout: 30m
  sources:
    - pvc:
        name: mosquitto-data
  volumeSnapshotClassName: miroir
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: mosquitto-local
spec:
  policyRef:
    name: mosquitto-local
  schedule:
    # Hash-spread; see components/kopiur/backup/snapshotschedule.yaml
    cron: "H * * * *"
    timezone: Europe/Belgrade
