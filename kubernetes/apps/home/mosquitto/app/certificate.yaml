---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cert-manager.io/issuer_v1.json
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mosquitto-selfsigned
spec:
  selfSigned: {}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-vesync
spec:
  secretName: mosquitto-vesync-tls
  issuerRef:
    name: mosquitto-selfsigned
    kind: Issuer
  # Mimic the real VeSync broker leaf cert (CN=vesync_server_new, SAN *.vesync.com)
  # so a device that only validates the leaf subject/SAN accepts it. If the
  # device verifies the chain up to vesyncRoot, no self-signed cert can pass.
  commonName: vesync_server_new
  subject:
    organizations:
      - vesync
    organizationalUnits:
      - vesync
    countries:
      - us
    provinces:
      - ca
    localities:
      - ca
  dnsNames:
    - "*.vesync.com"
    - "*.vesyncapi.com"
    - device-broker-v2-eu.vesync.com
    - vdmpmqtt.vesync.com
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
