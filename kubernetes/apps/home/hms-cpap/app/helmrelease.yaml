---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hms-cpap
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: hms-cpap
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      hms-cpap:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            image:
              # Back on upstream: v4.9.10 carries the multi-EVE fix (#22) and
              # the zip-upload STR.edf drop fix (#23), v4.10.0 the SQLite
              # sleep-day lookup — everything the quay.io/nklmilojevic fork
              # existed for.
              repository: ghcr.io/hms-homelab/hms-cpap
              tag: 5.2.4
            env:
              TZ: "Europe/Belgrade"
              WEB_PORT: &port 8893
              MQTT_BROKER: "mosquitto.home.svc.cluster.local"
              MQTT_PORT: "1883"
              ML_ENABLED: "true"
              ML_SCHEDULE: "weekly"
              ML_MODEL_DIR: "/config/models"
              ML_MIN_DAYS: "30"
              CPAP_TRANSPORT: local
              CPAP_FORMAT: resmed
              CPAP_LOCAL_DIR: /data/sdcard
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          ezshare-sync:
            image:
              repository: docker.io/library/python
              tag: 3.13-alpine
            command:
              - python3
              - -u
              - /app/ezshare_sync.py
            env:
              TZ: "Europe/Belgrade"
              EZ_BASE: http://10.50.0.22
              EZ_MODE: mule
              EZ_OUT: /data/sdcard
              EZ_STATE: /data/ezshare-sync-state.json
              EZ_DAYS: "7"
              EZ_INTERVAL: "900"
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: hms-cpap
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - cpap.nikola.wtf
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: hms-cpap
                port: *port
    persistence:
      config:
        existingClaim: hms-cpap-config
        globalMounts:
          - path: /config
            subPath: config
          - path: /data
            subPath: data
      ezshare-sync:
        type: configMap
        name: hms-cpap-ezshare-sync
        advancedMounts:
          hms-cpap:
            ezshare-sync:
              - path: /app/ezshare_sync.py
                subPath: ezshare_sync.py
                readOnly: true
