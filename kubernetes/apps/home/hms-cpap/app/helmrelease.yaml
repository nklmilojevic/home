---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hms-cpap
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: hms-cpap
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      hms-cpap:
        containers:
          app:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            image:
              repository: quay.io/nklmilojevic/hms-cpap
              # Built from the nklmilojevic/hms-cpap fork (containers#471),
              # carrying the multi-EVE sidecar fix (upstream hms-cpap#22) and
              # cpapdash-parser v2026.1.10-nkl.1 (multi-BRP timestamp collision
              # fixed upstream in v2026.1.10 but shipped images pin stale
              # v2026.1.3 — hms-cpapdash-parser#1). The containers pipeline
              # strips the -nkl.N prerelease suffix, so the tag is 4.9.9 and
              # the digest pins the exact fork build. Back to ghcr.io/
              # hms-homelab once the fixes land upstream.
              tag: 4.9.9@sha256:c93786ccfde5662e8cd66ce298022130d1ef566cd2c5cb76b982b32dcbd4d454
            env:
              TZ: "Europe/Belgrade"
              WEB_PORT: &port 8893
              MQTT_BROKER: "mosquitto.home.svc.cluster.local"
              MQTT_PORT: "1883"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: hms-cpap
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - cpap.nikola.wtf
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: hms-cpap
                port: *port
    persistence:
      config:
        existingClaim: hms-cpap-config
        globalMounts:
          - path: /config
            subPath: config
          - path: /data
            subPath: data
