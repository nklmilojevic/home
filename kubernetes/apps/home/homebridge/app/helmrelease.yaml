---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebridge
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: homebridge
  values:
    controllers:
      homebridge:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-host",
                "namespace":"network",
                "ips":["10.5.0.207/24"],
                "mac":"02:48:4d:42:00:01"
              }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              # Rootless build with homebridge-unifi-protect baked in;
              # jellyfin-ffmpeg included for QSV via the plugin's
              # videoProcessor option (containers repo).
              repository: quay.io/nklmilojevic/homebridge
              tag: 2.4.0@sha256:df29d103ae51cb9a4c96e338ea9943a3ee41e9c216f9c1a473f60ff9281e48ca
            env:
              TZ: Europe/Belgrade
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8581
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: homebridge
        ports:
          http:
            port: *port
            primary: true

    persistence:
      config:
        existingClaim: homebridge-config
        globalMounts:
          - path: /config

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.nikola.wtf"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
