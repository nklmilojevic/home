---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/storage.k8s.io/storageclass_v1.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: miroir.home-operations.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  miroir.home-operations.com/pool: nvme
  # 2 DISKFUL replicas plus a diskless tie-breaker on the third node, which is
  # what miroir provisions at this count. Three quorum voters, so a volume
  # survives losing any one node, while only two nodes carry data.
  #
  # Was 3. That existed to guarantee a volume could never have a diskless
  # primary (miroir#409, which silently hung 8/36 snapshots on 0.11.19), and is
  # obsolete: #411 fixed it in 0.11.20 by snapshotting off the diskful legs and
  # we run 0.12.0. Meanwhile asking for 3 actively hurt -- with all three legs
  # required, two healthy legs are "not enough" and the whole volume fails
  # ResourceExhausted the moment one agent dies, which is how a single OOMKilled
  # agent took out a snapshot wave on 2026-08-29.
  #
  # The tie-breaker needs no storage, so this holds while icarus003 runs with
  # its NVMe pulled (removed 2026-08-30; the NAB6 Lite passively-cooled M.2 slot
  # cooked two drives at 81C). Deliberately permanent -- keep 2 even once that
  # disk is back. That also means autoDiskfulAfter must STAY disabled: enabling
  # it would promote the tie-breaker to a diskful leg and quietly restore 3.
  miroir.home-operations.com/replicas: "2"
  # last-man-standing, not freeze: a volume down to its final replica keeps
  # serving instead of blocking I/O. With autoTieBreaker on there are three
  # voters (2 diskful + a diskless tie-breaker), so freeze already survived a
  # single node loss -- this additionally covers losing two, at the cost of
  # letting the last copy accept writes with nothing to arbitrate against.
  # Matches bjw-s-labs/home-ops; Diaoul/home-ops runs freeze. Both are in use
  # upstream, so this is an availability-vs-safety preference, not a fix.
  miroir.home-operations.com/quorum: last-man-standing
  csi.storage.k8s.io/fstype: ext4
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/storage.k8s.io/storageclass_v1.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: miroir-local
provisioner: miroir.home-operations.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  miroir.home-operations.com/pool: nvme
  miroir.home-operations.com/replicas: "1"
  csi.storage.k8s.io/fstype: ext4
