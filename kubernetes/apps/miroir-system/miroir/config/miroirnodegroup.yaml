---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/miroir.home-operations.com/miroirnodegroup_v1alpha1.json
apiVersion: miroir.home-operations.com/v1alpha1
kind: MiroirNodeGroup
metadata:
  name: default
spec:
  # All three nodes carry a pool again. icarus003 was split out into a separate
  # `tiebreak` group with a loopfile pool on 2026-08-30 while its NVMe was out
  # for cooling -- a node with no pool is not expressible (pools is minItems:1)
  # and an agent that loses every pool exits, which also took the CSI node
  # plugin down there. Its M.2 fan is now fitted and the disk is back.
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  template:
    pools:
      - name: nvme
        lvmthin:
          device: /dev/disk/by-partlabel/r-miroir
