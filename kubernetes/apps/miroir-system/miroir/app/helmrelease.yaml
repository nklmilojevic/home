---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
  namespace: miroir-system
spec:
  interval: 5m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: miroir
  values:
    # Rebuild a dead node's replica legs on the spare node after 1h
    # (safety-gated: single dead node, clean survivors, no snapshot pins).
    autoEvictAfter: 1h
    # Convert a diskless primary that has settled on a node for 15m into a
    # local diskful replica: stops paying network I/O AND makes the volume
    # snapshottable again — CSI snapshots silently hang on diskless primaries
    # (8/36 backups failed this way after failover-test pod shuffling).
    autoDiskfulAfter: 15m
    drbd:
      # DRBD activity-log extents (default 1237): fewer hot-extent metadata
      # updates under scattered random writes, longer post-crash resync.
      alExtents: 6007
    agent:
      # Chart default is a 128Mi limit; steady state is already 72-75Mi, which
      # left almost no headroom. icarus003's agent was OOMKilled (exit 137)
      # mid-burst during the first unstaggered 46-volume snapshot wave on
      # 2026-08-29, and the restart stranded LVs whose device nodes never
      # materialised -- every later CSI clone on that node then failed with
      # "unusable after vgmknodes ... No such file or directory". Because the
      # StorageClass asks for 3 replicas, two healthy legs are not enough and
      # the whole volume fails ResourceExhausted.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
    groupSnapshots:
      enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    replicaCount: 2
