---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
  namespace: miroir-system
spec:
  interval: 5m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: miroir
  values:
    # Rebuild a dead node's replica legs on the spare node after 1h
    # (safety-gated: single dead node, clean survivors, no snapshot pins).
    autoEvictAfter: 1h
    # DISABLED 2026-08-30 while icarus003's NVMe has no active cooler: the
    # NAB6 Lite ships its M.2 fan only with the SSD-equipped SKU, so that slot
    # is passively cooled and has already cooked two drives (81°C vs 54-58°C on
    # its peers). icarus003 is a diskless tie-breaker for every volume; leaving
    # this on would silently re-attach that NVMe 15m after any pod settled
    # there and full-resync onto it.
    #
    # Only the network-I/O half of this setting still matters. Its other
    # purpose -- making a volume snapshottable -- is obsolete: miroir#409
    # ("snapshot staging hangs silently when the primary is diskless", which
    # failed 8/36 of our backups on 0.11.19) was fixed by miroir#411 in
    # 0.11.20, which snapshots off the diskful legs instead. We run 0.12.0.
    #
    # Empty string is the documented disable (the chart schema types this as a
    # Go duration string; a bare 0 fails values-schema validation).
    #
    # Now PERMANENT, not just while the NVMe is out. The StorageClass settled on
    # 2 diskful replicas + a diskless tie-breaker as the intended steady state
    # (2026-08-30), and this setting is precisely what would undo that: it
    # promotes a diskless leg to diskful, silently turning every volume back
    # into a 3-leg one. Do not re-enable when the M.2 fan is fitted.
    autoDiskfulAfter: ""
    drbd:
      # DRBD activity-log extents (default 1237): fewer hot-extent metadata
      # updates under scattered random writes, longer post-crash resync.
      alExtents: 6007
    agent:
      # Chart default is a 128Mi limit; steady state is already 72-75Mi, which
      # left almost no headroom. icarus003's agent was OOMKilled (exit 137)
      # mid-burst during the first unstaggered 46-volume snapshot wave on
      # 2026-08-29, and the restart stranded LVs whose device nodes never
      # materialised -- every later CSI clone on that node then failed with
      # "unusable after vgmknodes ... No such file or directory". That blast
      # radius came from the StorageClass then asking for 3 replicas, so two
      # healthy legs were "not enough" and the whole volume failed
      # ResourceExhausted; at 2 replicas one dead agent no longer condemns the
      # volume, but the headroom below is still what stops the OOM itself.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
    groupSnapshots:
      enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    replicaCount: 2
