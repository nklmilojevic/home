---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app miroir
spec:
  targetNamespace: miroir-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: snapshot-controller
      namespace: security
  path: ./kubernetes/apps/miroir-system/miroir/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app miroir-config
spec:
  targetNamespace: miroir-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: miroir
      namespace: miroir-system
  path: ./kubernetes/apps/miroir-system/miroir/config
  prune: true
  # StorageClass.parameters is immutable, so changing the replica count fails a
  # plain apply with `field is immutable` and the class silently stays at its
  # old value. force lets the controller delete and recreate it. Safe here: it
  # only engages when a patch fails on an immutable field, and everything in
  # this path (storage/snapshot classes, node group) is consulted at provision
  # time -- recreating a class does not disturb volumes already bound.
  force: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
