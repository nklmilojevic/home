---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: photos
  annotations:
    # Required for seamless bootstrap with WAL archiving enabled:
    # https://github.com/cloudnative-pg/cloudnative-pg/issues/5778
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  # Single instance: Ceph already replicates the volume; more instances only
  # add write amplification on top of replicated storage.
  instances: 1
  # With instances: 1 the CNPG-managed PDB guards the primary at minAvailable: 1,
  # so allowed disruptions is permanently 0 and any node drain blocks forever
  # (stalled the Talos v1.14.0-rc.2 roll on icarus002). No PDB means a drain can
  # evict Postgres; a single-instance cluster has no HA to protect anyway.
  enablePDB: false
  # Immich requires the VectorChord extension; stock CNPG images lack it.
  # The VectorChord version range is constrained by the Immich release, so
  # this image is bumped manually alongside Immich upgrades.
  # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-vectorchord enabled=false
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.0-0.5.3@sha256:267f6cbb32af6e109e138a143c7e9dd5d44d68433ec2303f0c30e745c788d1a9
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: miroir
  enableSuperuserAccess: true
  superuserSecret:
    name: immich-pg-secret
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "200"
      shared_buffers: 512MB
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-pg
        serverName: immich-pg-v2
  # Rebuilt from the R2 barman backup at the 2026-08-29 miroir cutover: the
  # ceph-block PVC that held this database was deleted with the rest of Ceph,
  # and immich-pg is NOT covered by kopiur -- barman-cloud is its only backup.
  # Recovers the immich-pg-v1 archive (base backup 03:00 + WAL) and writes its
  # own archive as immich-pg-v2 so the two do not clash.
  #
  # To rebuild again: bump serverName (v3), point source at the archive to
  # recover from, and delete the Cluster + its PVC so CNPG bootstraps fresh.
  bootstrap:
    recovery:
      source: &recoveryServer immich-pg-v1
      # MUST be set explicitly. A recovery bootstrap does not inherit these
      # from the initdb block it replaces -- CNPG defaults both to `app`, mints
      # an immich-pg-app secret pointing at a database/user that do not exist in
      # the restored cluster, and immich then fails with "permission denied to
      # create extension" because it is connecting as an unprivileged `app`
      # rather than the restored superuser `immich`.
      database: immich
      owner: immich
  externalClusters:
    - name: *recoveryServer
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: immich-pg
          serverName: *recoveryServer
