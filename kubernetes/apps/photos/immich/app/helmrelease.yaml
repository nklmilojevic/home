---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: photos
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    defaultPodOptions:
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: immich-gpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
          - 105
    controllers:
      immich:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.0@sha256:be56bc12c17a84617a979ad1eab1d9105bbec1955ffa7da09b3f9cf79d3bd09d
            env:
              TZ: "Europe/Belgrade"
              IMMICH_MEDIA_LOCATION: &mediaLocation /library
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-pg-app
                    key: uri
              REDIS_HOSTNAME: redis-immich.database.svc.cluster.local
              IMMICH_TELEMETRY_INCLUDE: all
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
      machine-learning:
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.0-openvino@sha256:a79670d05f8da90c86f8074afe1beaf51abee53c58692ad45cae2efd9afd4aca
            env:
              TZ: "Europe/Belgrade"
              IMMICH_MEDIA_LOCATION: *mediaLocation
              MPLCONFIGDIR: /cache/matplotlib
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &mlPort 3003
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 60
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
    service:
      immich:
        controller: immich
        ports:
          http:
            port: &port 2283
          metrics-api:
            port: 8081
          metrics-ms:
            port: 8082
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: *mlPort
    serviceMonitor:
      app:
        serviceName: immich
        endpoints:
          - port: metrics-api
            scheme: http
            path: /metrics
          - port: metrics-ms
            scheme: http
            path: /metrics
    route:
      app:
        hostnames:
          - immich.nikola.wtf
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: immich
                port: *port
      share:
        annotations:
          # rules[0] matches /auth first and the sidecar probes the first path it
          # finds, which Envoy answers with a direct 404. Probe the app instead.
          gatus.home-operations.com/endpoint: |
            path: /api/server/ping
        hostnames:
          - share.nikola.wtf
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          # Deny-list: Envoy answers these with a direct 404, no backendRefs.
          # Exact / and longer PathPrefixes outrank the catch-all in Gateway API,
          # so the app shell is only reachable from a share link, not the root.
          - matches:
              - path:
                  type: Exact
                  value: /
              - path:
                  type: PathPrefix
                  value: /auth
              - path:
                  type: PathPrefix
                  value: /admin
              - path:
                  type: PathPrefix
                  value: /api/auth
              - path:
                  type: PathPrefix
                  value: /api/admin
              - path:
                  type: PathPrefix
                  value: /api/oauth
              - path:
                  type: PathPrefix
                  value: /api/users
              - path:
                  type: PathPrefix
                  value: /api/sessions
              - path:
                  type: PathPrefix
                  value: /api/api-keys
              - path:
                  type: PathPrefix
                  value: /api/socket.io
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: gateway.envoyproxy.io
                  kind: HTTPRouteFilter
                  name: immich-share-deny
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: immich
                port: *port
    persistence:
      library:
        type: nfs
        server: 10.5.0.10
        path: /var/nfs/shared/photos
        advancedMounts:
          immich:
            app:
              - path: *mediaLocation
      ml-cache:
        existingClaim: immich-ml-cache
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dot-cache
      tmp:
        type: emptyDir
        advancedMounts:
          immich:
            app:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
