---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kritika-netpol-canary
  namespace: kritika
spec:
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/component: runner
            kritika.home-operations.com/role: runner
        spec:
          restartPolicy: Never
          serviceAccountName: kritika-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: ghcr.io/home-operations/kritika:0.0.4-tools@sha256:115d2c24347b39644d33f362a6878701d8bd04eca3ca364f6f6bba7f342ffa44
              command:
                - /bin/sh
                - -c
                - |
                  fail=0
                  gw=http://kritika-gateway.kritika.svc.cluster.local:8082
                  expect() {
                    want=$1; name=$2; shift 2
                    "$@" >/dev/null 2>&1; rc=$?
                    case "$want:$rc" in
                      ok:0 | blocked:[!0]*) echo "PASS $name (rc=$rc)" ;;
                      *) echo "FAIL $name: want $want, rc=$rc"; fail=1 ;;
                    esac
                  }
                  expect ok dns nslookup kritika-pg-rw.kritika.svc.cluster.local
                  expect ok postgres nc -z -w 5 kritika-pg-rw.kritika.svc.cluster.local 5432
                  expect ok gateway-reachable nc -z -w 5 kritika-gateway.kritika.svc.cluster.local 8082
                  code=$(curl -s -m 10 -x "$gw" -o /dev/null -w '%{http_connect}' https://example.com)
                  if [ "$code" = 403 ]; then echo "PASS gateway-denies-unlisted-host (403)"; else echo "FAIL gateway-denies-unlisted-host: want 403, got $code"; fail=1; fi
                  expect blocked direct-internet curl -sS --noproxy '*' --connect-timeout 5 -m 8 -o /dev/null https://github.com
                  expect blocked direct-ip nc -z -w 5 1.1.1.1 443
                  expect blocked kube-apiserver nc -z -w 5 kubernetes.default.svc.cluster.local 443
                  expect blocked other-namespace nc -z -w 5 versitygw.security.svc.cluster.local 7070
                  exit $fail
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
          runtimeClassName: gvisor
