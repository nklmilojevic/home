---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
  namespace: kritika
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kritika
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://kritika.nikola.wtf
      runnerRuntimeClass: gvisor
      authAdminPassword:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: ADMIN_PASSWORD
    configFile:
      apps:
        github:
          accounts:
            - nklmilojevic
          clientId:
            env: GITHUB_APP_CLIENT_ID
          privateKey:
            env: GITHUB_APP_PRIVATE_KEY
          webhookSecret:
            env: GITHUB_APP_WEBHOOK_SECRET
      providers:
        litellm:
          type: openai
          baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
          apiKey:
            env: LITELLM_API_KEY
        openrouter:
          type: openrouter
          apiKey:
            env: OPENROUTER_API_KEY
      embedding:
        model: openrouter/openai/text-embedding-3-small
        dims: 1536
      review:
        model: litellm/chatgpt/gpt-6-sol
        diagram: true
      confidence:
        model: litellm/chatgpt/gpt-6-sol
        threshold: 4
        risk: medium
      agent:
        prompt: 200000
        tokens: 16000000
    env:
      GITHUB_APP_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_CLIENT_ID
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_PRIVATE_KEY
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_WEBHOOK_SECRET
      LITELLM_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: LITELLM_API_KEY
      OPENROUTER_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: OPENROUTER_API_KEY
    database:
      owner:
        existingSecret: kritika-db-owner
      app:
        existingSecret: kritika-db-app
      runner:
        existingSecret: kritika-db-runner
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: ""
      hostnames:
        - kritika.nikola.wtf
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
    networkPolicy:
      enabled: true
      egressPorts:
        - 443
        - 4000
    monitoring:
      serviceMonitor:
        enabled: true
