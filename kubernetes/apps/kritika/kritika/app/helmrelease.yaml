---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
  namespace: kritika
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kritika
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://kritika.nikola.wtf
      reviewWorkers: 10
      egress:
        allow:
          - ghcr.io
          - pkg-containers.githubusercontent.com
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD
      apps:
        github:
          accounts:
            - nklmilojevic
          clientId:
            env: GITHUB_APP_CLIENT_ID
          privateKey:
            env: GITHUB_APP_PRIVATE_KEY
          webhookSecret:
            env: GITHUB_APP_WEBHOOK_SECRET
      providers:
        meridian:
          type: anthropic
          baseUrl: http://meridian.ai.svc.cluster.local:3456
          concurrency: 3
          apiKey:
            env: MERIDIAN_API_KEY
        cliproxyapi:
          type: openai
          baseUrl: http://cliproxyapi.ai.svc.cluster.local:8317/v1
          concurrency: 10
          apiKey:
            env: CLIPROXYAPI_API_KEY
      review:
        model: meridian/claude-sonnet-5-5
        fallback: cliproxyapi/gpt-6-luna
        diagram: true
      confidence:
        model: meridian/claude-sonnet-5-5
        fallback: cliproxyapi/gpt-6-luna
        effort: low
        threshold: 4
        risk: medium
      agent:
        prompt: 200000
        tokens: 16000000
    env:
      ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: ADMIN_PASSWORD
      GITHUB_APP_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_CLIENT_ID
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_PRIVATE_KEY
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_WEBHOOK_SECRET
      MERIDIAN_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: MERIDIAN_API_KEY
      CLIPROXYAPI_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: CLIPROXYAPI_API_KEY
    runner:
      runtimeClass: gvisor
    database:
      owner:
        existingSecret: kritika-db-owner
      app:
        existingSecret: kritika-db-app
      runner:
        existingSecret: kritika-db-runner
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: ""
      hostnames:
        - kritika.nikola.wtf
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
    networkPolicy:
      enabled: true
      egressPorts:
        - 443
        - 8317
        - 3456
    monitoring:
      serviceMonitor:
        enabled: true
