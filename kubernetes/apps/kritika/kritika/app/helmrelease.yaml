---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
  namespace: kritika
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kritika
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://kritika.nikola.wtf
      reviewWorkers: 10
      egress:
        allow:
          - ghcr.io
          - pkg-containers.githubusercontent.com
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD
      apps:
        github:
          accounts:
            - nklmilojevic
          clientId:
            env: GITHUB_APP_CLIENT_ID
          privateKey:
            env: GITHUB_APP_PRIVATE_KEY
          webhookSecret:
            env: GITHUB_APP_WEBHOOK_SECRET
      providers:
        cliproxyapi:
          type: openai
          baseUrl: http://cliproxyapi.ai.svc.cluster.local:8317/v1
          concurrency: 10
          apiKey:
            env: CLIPROXYAPI_API_KEY
        omlx:
          type: openai
          baseUrl: http://10.5.0.253:8000/v1
          concurrency: 2
          timeout: 15m
          apiKey:
            env: OMLX_API_KEY
          pricing:
            Inkling-2-Mini-oQ4e-mtp:
              input: 0
              output: 0
        openrouter:
          type: openrouter
          apiKey:
            env: OPENROUTER_API_KEY
      embedding:
        model: openrouter/openai/text-embedding-3-small
        dims: 1536
      review:
        model: omlx/Inkling-2-Mini-oQ4e-mtp
        diagram: true
      confidence:
        model: omlx/Inkling-2-Mini-oQ4e-mtp
        threshold: 4
        risk: medium
      agent:
        prompt: 64000
        tokens: 16000000
    env:
      ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: ADMIN_PASSWORD
      GITHUB_APP_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_CLIENT_ID
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_PRIVATE_KEY
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_WEBHOOK_SECRET
      CLIPROXYAPI_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: CLIPROXYAPI_API_KEY
      OMLX_API_KEY: unused
      OPENROUTER_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: OPENROUTER_API_KEY
    runner:
      runtimeClass: gvisor
    database:
      owner:
        existingSecret: kritika-db-owner
      app:
        existingSecret: kritika-db-app
      runner:
        existingSecret: kritika-db-runner
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: ""
      hostnames:
        - kritika.nikola.wtf
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
    networkPolicy:
      enabled: true
      egressPorts:
        - 443
        - 8317
      extraEgress:
        - to:
            - ipBlock:
                cidr: 10.5.0.253/32
          ports:
            - port: 8000
              protocol: TCP
    monitoring:
      serviceMonitor:
        enabled: true
