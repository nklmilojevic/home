---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
  namespace: kritika
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kritika
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://kritika.nikola.wtf
      auth:
        admin:
          password:
            env: ADMIN_PASSWORD
      apps:
        github:
          accounts:
            - nklmilojevic
          clientId:
            env: GITHUB_APP_CLIENT_ID
          privateKey:
            env: GITHUB_APP_PRIVATE_KEY
          webhookSecret:
            env: GITHUB_APP_WEBHOOK_SECRET
      providers:
        cliproxyapi:
          type: openai
          baseUrl: http://cliproxyapi.ai.svc.cluster.local:8317/v1
          apiKey:
            env: CLIPROXYAPI_API_KEY
        openrouter:
          type: openrouter
          apiKey:
            env: OPENROUTER_API_KEY
      embedding:
        model: openrouter/openai/text-embedding-3-small
        dims: 1536
      review:
        model: cliproxyapi/gpt-6-sol
        diagram: true
        agents:
          - name: security
            categories:
              - security
            effort: high
            instructions: |-
              Review the change as an application security engineer, following the security-audit skill in guidance mode only: never start its full audit workflow, write audit artifacts or run target code.
              Report only findings with a concrete trust boundary, an affected principal or resource, and a reachable source path in this change. Treat anything you could not confirm from source as needing validation and say what would confirm it.
              For infrastructure and GitOps changes, weigh exposed routes and LoadBalancers, NetworkPolicy gaps, privileged or root containers, host mounts, RBAC widening, secret handling and unpinned images or actions.
            skills:
              scope:
                security-audit:
                  load: true
      confidence:
        model: cliproxyapi/gpt-6-sol
        threshold: 4
        risk: medium
      agent:
        prompt: 200000
        tokens: 16000000
    env:
      ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: ADMIN_PASSWORD
      GITHUB_APP_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_CLIENT_ID
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_PRIVATE_KEY
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_WEBHOOK_SECRET
      CLIPROXYAPI_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: CLIPROXYAPI_API_KEY
      OPENROUTER_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: OPENROUTER_API_KEY
    runner:
      runtimeClass: gvisor
    database:
      owner:
        existingSecret: kritika-db-owner
      app:
        existingSecret: kritika-db-app
      runner:
        existingSecret: kritika-db-runner
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: ""
      hostnames:
        - kritika.nikola.wtf
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
    networkPolicy:
      enabled: true
      egressPorts:
        - 443
        - 8317
    monitoring:
      serviceMonitor:
        enabled: true
