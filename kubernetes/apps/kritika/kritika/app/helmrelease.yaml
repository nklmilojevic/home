---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
  namespace: kritika
spec:
  interval: 30m
  chart:
    spec:
      chart: ./charts/kritika
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: kritika
  values:
    image:
      repository: ghcr.io/home-operations/kritika
      tag: &image main@sha256:c37b169e1509a6f6c5ad0e6b2269dfb089f24601b08287f0d981f5963528025b
    runner:
      image: ghcr.io/home-operations/kritika:main-tools@sha256:5d053c7e270297e7299ed9ed82c0784d8df3ef8336e08ec193129449ca4d6a68
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    podAnnotations:
      kritika.nikola.wtf/image: *image
    web:
      url: https://kritika.nikola.wtf
    config:
      apps:
        github:
          accounts:
            - nklmilojevic
          clientId:
            env: GITHUB_APP_CLIENT_ID
          privateKey:
            env: GITHUB_APP_PRIVATE_KEY
          webhookSecret:
            env: GITHUB_APP_WEBHOOK_SECRET
      providers:
        litellm:
          type: openai
          baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
          apiKey:
            env: LITELLM_API_KEY
        openrouter:
          type: openrouter
          apiKey:
            env: OPENROUTER_API_KEY
      embedding:
        model: openrouter/voyageai/voyage-code-4
        dims: 1024
      defaults:
        models:
          review: litellm/chatgpt/gpt-6-sol
    env:
      KRITIKA_RUNNER_RUNTIME_CLASS: gvisor
      KRITIKA_AUTH_ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: ADMIN_PASSWORD
      GITHUB_APP_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_CLIENT_ID
      GITHUB_APP_PRIVATE_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_PRIVATE_KEY
      GITHUB_APP_WEBHOOK_SECRET:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: GITHUB_APP_WEBHOOK_SECRET
      LITELLM_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: LITELLM_API_KEY
      OPENROUTER_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-secret
            key: OPENROUTER_API_KEY
    database:
      owner:
        existingSecret: kritika-db-owner
      app:
        existingSecret: kritika-db-app
      runner:
        existingSecret: kritika-db-runner
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: ""
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
    networkPolicy:
      enabled: true
      egressPorts:
        - 443
        - 4000
    monitoring:
      serviceMonitor:
        enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kritika
            patch: |
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: reset-schema
                    image: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
                    command:
                      - /bin/sh
                      - -c
                      - |
                        exec psql "$OWNER_URI" -v ON_ERROR_STOP=1 -v image="$IMAGE" <<'SQL'
                        SET lock_timeout = '60s';
                        BEGIN;
                        SELECT pg_advisory_xact_lock(hashtext('kritika-reset'));
                        SELECT set_config('kritika.image', :'image', true);
                        DO $reset$
                        BEGIN
                          IF to_regclass('kritika_reset.marker') IS NOT NULL THEN
                            IF EXISTS (SELECT 1 FROM kritika_reset.marker WHERE image = current_setting('kritika.image')) THEN
                              RAISE NOTICE 'schema already built for %', current_setting('kritika.image');
                              RETURN;
                            END IF;
                          END IF;
                          RAISE NOTICE 'resetting schema for %', current_setting('kritika.image');
                          IF (SELECT nspowner FROM pg_namespace WHERE nspname = 'public') = (SELECT oid FROM pg_roles WHERE rolname = current_user) THEN
                            ALTER SCHEMA public OWNER TO pg_database_owner;
                          END IF;
                          DROP OWNED BY CURRENT_USER;
                          CREATE SCHEMA kritika_reset;
                          CREATE TABLE kritika_reset.marker (image text PRIMARY KEY);
                          INSERT INTO kritika_reset.marker VALUES (current_setting('kritika.image'));
                        END
                        $reset$;
                        COMMIT;
                        SQL
                    env:
                      - name: IMAGE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.annotations['kritika.nikola.wtf/image']
                      - name: HOME
                        value: /tmp
                      - name: OWNER_URI
                        valueFrom:
                          secretKeyRef:
                            name: kritika-db-owner
                            key: uri
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
