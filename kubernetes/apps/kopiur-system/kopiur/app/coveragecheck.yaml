---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kopiur-coverage-check
  namespace: kopiur-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kopiur-coverage-check
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list"]
  - apiGroups: ["kopiur.home-operations.com"]
    resources: ["snapshotpolicies"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kopiur-coverage-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kopiur-coverage-check
subjects:
  - kind: ServiceAccount
    name: kopiur-coverage-check
    namespace: kopiur-system
---
# Nightly guard: every persistent miroir PVC must be covered by a kopiur
# SnapshotPolicy or explicitly exempted below. A failing Job trips the
# standard KubeJobFailed alerting. This catches chart/operator-created PVCs
# that silently escape the backup net (the jellyfin /metadata volume was
# lost at the miroir cutover this way).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kopiur-coverage-check
  namespace: kopiur-system
spec:
  schedule: "0 6 * * *"
  timeZone: Europe/Belgrade
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: kopiur-coverage-check
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: check
              image: docker.io/alpine/k8s:1.33.4
              env:
                - name: EXEMPT
                  # Deliberately unbacked volumes (fresh-start-by-design):
                  # redis (rebuildable), o11y metrics/logs/history, caches,
                  # jellyfin artwork (regenerates), grafana (Git-provisioned).
                  value: "^database/|^o11y/|^media/seerr-cache$|^media/jellyfin$|^home/home-assistant-cache$|^home/home-assistant-media$|^home/mosquitto-data$|^home/petkit-local-media$"
              command:
                - sh
                - -c
                - |
                  set -eu
                  pvcs=$(kubectl get pvc -A -o json | jq -r '.items[]
                    | select((.spec.storageClassName // "") | startswith("miroir"))
                    | select(.metadata.name | startswith("kopiur-cache-") | not)
                    | "\(.metadata.namespace)/\(.metadata.name)"')
                  covered=$(kubectl get snapshotpolicies.kopiur.home-operations.com -A -o json | jq -r '.items[]
                    | .metadata.namespace as $ns
                    | (.spec.sources[]?.pvc.name // empty)
                    | "\($ns)/\(.)"')
                  rc=0
                  for p in $pvcs; do
                    echo "$covered" | grep -qx "$p" && continue
                    echo "$p" | grep -qE "$EXEMPT" && continue
                    echo "UNCOVERED PVC (no SnapshotPolicy, not exempt): $p"
                    rc=1
                  done
                  [ "$rc" = "0" ] && echo "backup coverage OK"
                  exit $rc
              resources:
                requests:
                  cpu: 10m
                limits:
                  memory: 128Mi
