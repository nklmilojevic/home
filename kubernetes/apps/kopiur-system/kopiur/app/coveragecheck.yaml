---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kopiur-coverage-check
  namespace: kopiur-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kopiur-coverage-check
rules:
  - apiGroups:
      - ""
    resources:
      - "persistentvolumeclaims"
    verbs:
      - "list"
  - apiGroups:
      - "kopiur.home-operations.com"
    resources:
      - "snapshotpolicies"
    verbs:
      - "list"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kopiur-coverage-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kopiur-coverage-check
subjects:
  - kind: ServiceAccount
    name: kopiur-coverage-check
    namespace: kopiur-system
---
# Nightly guard: every persistent miroir PVC must be covered by a kopiur
# SnapshotPolicy or explicitly exempted below. A failing Job trips the
# standard KubeJobFailed alerting. This catches chart/operator-created PVCs
# that silently escape the backup net (the jellyfin /metadata volume was
# lost at the miroir cutover this way).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kopiur-coverage-check
  namespace: kopiur-system
spec:
  schedule: "0 6 * * *"
  timeZone: Europe/Belgrade
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: kopiur-coverage-check
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: check
              image: docker.io/alpine/k8s:1.36.2
              env:
                - name: EXEMPT
                  # Deliberately unbacked volumes only: redis (rebuildable by
                  # its operator), pure caches, and grafana (dashboards come
                  # from Git). Everything else — including the o11y metrics and
                  # logs volumes, jellyfin artwork and the HA/mosquitto/petkit
                  # media claims — has a volsync source today and must keep a
                  # kopiur policy, or it silently drops out at the cutover.
                  #
                  # photos/immich-pg-1 is exempt because CloudNativePG owns its
                  # backups: the barman-cloud plugin ships WAL + daily base
                  # backups to R2 (ObjectStore immich-pg, ScheduledBackup
                  # immich-pg-daily, verified completing daily). A kopiur
                  # filesystem snapshot of a live Postgres data directory would
                  # be crash-consistent at best and is not the recovery path.
                  value: "^database/|^o11y/grafana-pvc$|^media/seerr-cache$|^home/home-assistant-cache$|^photos/immich-ml-cache$|^photos/immich-pg-1$"
              command:
                - sh
                - -c
                - |
                  set -eu
                  pvcs=$(kubectl get pvc -A -o json | jq -r '.items[]
                    | select((.spec.storageClassName // "") | (startswith("miroir") or startswith("ceph-block")))
                    | select(.metadata.name | startswith("kopiur-cache-") | not)
                    | "\(.metadata.namespace)/\(.metadata.name)"')
                  covered=$(kubectl get snapshotpolicies.kopiur.home-operations.com -A -o json | jq -r '.items[]
                    | .metadata.namespace as $ns
                    | (.spec.sources[]?.pvc.name // empty)
                    | "\($ns)/\(.)"')
                  rc=0
                  for p in $pvcs; do
                    echo "$covered" | grep -qx "$p" && continue
                    echo "$p" | grep -qE "$EXEMPT" && continue
                    echo "UNCOVERED PVC (no SnapshotPolicy, not exempt): $p"
                    rc=1
                  done
                  [ "$rc" = "0" ] && echo "backup coverage OK"
                  exit $rc
              resources:
                requests:
                  cpu: 10m
                limits:
                  memory: 128Mi
