---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  namespace: kopiur-system
spec:
  interval: 5m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: kopiur
  values:
    # `kopia=debug` surfaces kopia's own upload progress in mover logs; the
    # movers' only alternative is `progressIntervalSecs`, which is a bare
    # timestamp heartbeat and carries no byte/file counts. Scoped per-target so
    # the kube_client/hyper/rustls firehose stays at info. The controller passes
    # RUST_LOG + KOPIUR_LOG_FORMAT through to every mover Job, so this one value
    # covers the fleet — including the controller, whose in-process kopia
    # subprocesses are filtered back out in the vector aggregator.
    logging:
      level: "info,kopia=debug"
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
