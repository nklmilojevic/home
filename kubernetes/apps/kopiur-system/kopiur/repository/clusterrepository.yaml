---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: local
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-local-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: versitygw.security.svc.cluster.local:7070
      region: us-east-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-local-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    takeoverPolicy: Force
    schedule:
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
      full:
        cron: "20 16 * * *"
        jitter: 1m
  parameters:
    epoch:
      minDuration: 2h
  scheduleDefaults:
    timezone: Europe/Belgrade
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: r2
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: ${R2_ENDPOINT}
      region: auto
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    takeoverPolicy: Force
    schedule:
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
      full:
        cron: "0 5 * * *"
        jitter: 1h
  scheduleDefaults:
    timezone: Europe/Belgrade
