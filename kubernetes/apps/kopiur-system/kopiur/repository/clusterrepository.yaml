---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: local
spec:
  # The LAN copy, on the versitygw S3 gateway backed by the UNAS NFS share —
  # deliberately not on Ceph, so it survives the storage layer being torn down.
  # This is the repository the miroir cutover restores from: ~200 MB/s on the
  # LAN versus pulling 91 GiB back from Cloudflare.
  # Paired with the `r2` repository below, which took over the offsite copy at
  # the 2026-08-29 cutover when volsync was removed.
  # Points at the Service, not s3.nikola.wtf: Envoy buffers request bodies and
  # kopia blobs are multi-MB, so backup traffic has no business crossing the
  # gateway.
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-local-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: versitygw.security.svc.cluster.local:7070
      # versitygw validates the SigV4 region in the authorization header and
      # expects us-east-1; `auto` is an R2-ism and fails bootstrap with
      # "The authorization header is malformed".
      region: us-east-1
      tls:
        # versitygw serves plain HTTP in-cluster; TLS is terminated at the
        # gateway, which this path bypasses.
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-local-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  moverDefaults:
    affinity:
      # TEMPORARY -- remove when icarus003 is restored to 3 replicas (it is
      # waiting on an M.2 heatsink fan; see autoDiskfulAfter).
      #
      # A mover needs two RWO volumes on one node: the staging clone and its
      # kopia cache. miroir honours the scheduler's selectedNode for the clone
      # ONLY if a source replica already lives there; otherwise it silently
      # places the clone on a node that has one and stamps the PV with that
      # node's affinity. The cache (openebs-hostpath) meanwhile follows the
      # scheduler. When those disagree the pod fails PreBind with
      # "node affinity doesn't match", the cache is already bound, and nothing
      # ever kills it -- SnapshotSchedule has no podStartupDeadlineSeconds, so
      # the backup wedges Pending indefinitely. That is what stalled hermes.
      #
      # 55 of 56 volumes are 2/2 since icarus003 was drained, so icarus003
      # holds no replica for almost every source and is the only node that can
      # trigger the fallback. Keeping movers off it means the hint is always
      # honourable and both volumes land together.
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - icarus003
  maintenance:
    # Maintenance had never run once in the 25h since bootstrap: lastRun was
    # empty and LeaseOwned sat False/WaitingForRepository, stamped 11:31 while
    # the repository only went healthy at 11:44 after versitygw stopped OOMing.
    # Nothing re-triggers a Maintenance reconcile when its target recovers, so
    # the stale verdict stuck and index blobs climbed to 4048 (threshold 1000),
    # slowing every mover's connect.
    #
    # Force is the documented recovery for a lease held by a dead owner. It is
    # safe to leave on: kopiur is the only maintainer of these repositories, so
    # there is no competing owner whose lease could be wrongly seized.
    takeoverPolicy: Force
    schedule:
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
      full:
        # Explicitly 05:00, not the chart default of 03:00. The r2 wave runs at
        # 03:00 and full maintenance is the heaviest thing that touches the
        # repository, so the default put blob rewriting directly under the one
        # nightly burst that most needs the backend responsive -- the same kind
        # of pile-up that OOMed versitygw.
        cron: "0 5 * * *"
        jitter: 1h
  parameters:
    epoch:
      # kopia's default 24h gate, with compaction trailing two epochs, means
      # blobs written now are not compacted for ~48h. This repository takes 46
      # apps hourly (~1100 snapshots/day), which outruns that. 6h lets an epoch
      # close and compact while the write rate is still ahead of it.
      # Not applied to r2: it is daily and its IndexBlobHealth is Healthy.
      minDuration: 6h
  scheduleDefaults:
    timezone: Europe/Belgrade
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: r2
spec:
  # The offsite copy, live since the 2026-08-29 cutover removed volsync. Same
  # kopia password as `local` so there is one secret to keep safe, but a wholly
  # independent repository — a bug that corrupts one cannot reach the other.
  #
  # `local` is the restore path (LAN, ~200 MB/s); this exists for the case where
  # the UNAS is gone. The endpoint is kept out of this public repo and injected
  # from the kopiur-endpoint Secret via postBuild.substituteFrom in ks.yaml.
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: ${R2_ENDPOINT}
      # R2 ignores the region but requires a valid-looking value; `auto` is the
      # Cloudflare convention. Do NOT copy us-east-1 from `local` — that value
      # exists only because versitygw validates the SigV4 region header.
      region: auto
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  moverDefaults:
    affinity:
      # TEMPORARY -- remove when icarus003 is restored to 3 replicas (it is
      # waiting on an M.2 heatsink fan; see autoDiskfulAfter).
      #
      # A mover needs two RWO volumes on one node: the staging clone and its
      # kopia cache. miroir honours the scheduler's selectedNode for the clone
      # ONLY if a source replica already lives there; otherwise it silently
      # places the clone on a node that has one and stamps the PV with that
      # node's affinity. The cache (openebs-hostpath) meanwhile follows the
      # scheduler. When those disagree the pod fails PreBind with
      # "node affinity doesn't match", the cache is already bound, and nothing
      # ever kills it -- SnapshotSchedule has no podStartupDeadlineSeconds, so
      # the backup wedges Pending indefinitely. That is what stalled hermes.
      #
      # 55 of 56 volumes are 2/2 since icarus003 was drained, so icarus003
      # holds no replica for almost every source and is the only node that can
      # trigger the fallback. Keeping movers off it means the hint is always
      # honourable and both volumes land together.
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - icarus003
  maintenance:
    # Same stale-lease recovery as `local` above; r2's Maintenance had likewise
    # never run. Its index blob count is still Healthy, so it gets no epoch
    # override -- one daily wave does not outrun the 24h default.
    takeoverPolicy: Force
    schedule:
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
      full:
        # Explicitly 05:00, not the chart default of 03:00. The r2 wave runs at
        # 03:00 and full maintenance is the heaviest thing that touches the
        # repository, so the default put blob rewriting directly under the one
        # nightly burst that most needs the backend responsive -- the same kind
        # of pile-up that OOMed versitygw.
        cron: "0 5 * * *"
        jitter: 1h
  scheduleDefaults:
    timezone: Europe/Belgrade
