---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritik
  namespace: kritik
spec:
  interval: 30m
  chart:
    spec:
      chart: ./charts/kritik
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: kritik
  values:
    image:
      repository: ghcr.io/home-operations/kritik
      tag: &image main@sha256:a8458265ae8ab3a9a8242380afac69c760ee43da96b94f13b82b92871e0de8a9
    runner:
      image: ghcr.io/home-operations/kritik:main-tools@sha256:d0b73d5648612e4ffdd4f09525122c12b462b730d25dbf371b0b18980b01949f
      runtimeClassName: gvisor
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    podAnnotations:
      kritik.nikola.wtf/image: *image
    web:
      url: https://kritik.nikola.wtf
    auth:
      admin:
        passwordSecret:
          name: kritik-secret
          key: ADMIN_PASSWORD
    config:
      file:
        apps:
          - name: github
            accounts:
              - nklmilojevic
            clientId:
              env: GITHUB_APP_CLIENT_ID
            privateKey:
              env: GITHUB_APP_PRIVATE_KEY
            webhookSecret:
              env: GITHUB_APP_WEBHOOK_SECRET
        providers:
          litellm:
            type: openai
            baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
            apiKey:
              env: LITELLM_API_KEY
          openrouter:
            type: openrouter
            apiKey:
              env: OPENROUTER_API_KEY
        embedding:
          model: openrouter/voyageai/voyage-code-4
          dims: 1024
        defaults:
          models:
            review: litellm/chatgpt/gpt-6-sol
    secretEnv:
      - name: GITHUB_APP_CLIENT_ID
        secretName: kritik-secret
        key: GITHUB_APP_CLIENT_ID
      - name: GITHUB_APP_PRIVATE_KEY
        secretName: kritik-secret
        key: GITHUB_APP_PRIVATE_KEY
      - name: GITHUB_APP_WEBHOOK_SECRET
        secretName: kritik-secret
        key: GITHUB_APP_WEBHOOK_SECRET
      - name: LITELLM_API_KEY
        secretName: kritik-secret
        key: LITELLM_API_KEY
      - name: OPENROUTER_API_KEY
        secretName: kritik-secret
        key: OPENROUTER_API_KEY
    database:
      owner:
        existingSecret: kritik-db-owner
      app:
        existingSecret: kritik-db-app
      runner:
        existingSecret: kritik-db-runner
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: ""
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
    networkPolicy:
      enabled: true
      egressPorts:
        - 443
        - 4000
    monitoring:
      serviceMonitor:
        enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kritik
            patch: |
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: reset-schema
                    image: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
                    command:
                      - /bin/sh
                      - -c
                      - |
                        exec psql "$OWNER_URI" -v ON_ERROR_STOP=1 -v image="$IMAGE" <<'SQL'
                        SET lock_timeout = '60s';
                        BEGIN;
                        SELECT pg_advisory_xact_lock(hashtext('kritik-reset'));
                        SELECT set_config('kritik.image', :'image', true);
                        DO $reset$
                        BEGIN
                          IF to_regclass('kritik_reset.marker') IS NOT NULL THEN
                            IF EXISTS (SELECT 1 FROM kritik_reset.marker WHERE image = current_setting('kritik.image')) THEN
                              RAISE NOTICE 'schema already built for %', current_setting('kritik.image');
                              RETURN;
                            END IF;
                          END IF;
                          RAISE NOTICE 'resetting schema for %', current_setting('kritik.image');
                          IF (SELECT nspowner FROM pg_namespace WHERE nspname = 'public') = (SELECT oid FROM pg_roles WHERE rolname = current_user) THEN
                            ALTER SCHEMA public OWNER TO pg_database_owner;
                          END IF;
                          DROP OWNED BY CURRENT_USER;
                          CREATE SCHEMA kritik_reset;
                          CREATE TABLE kritik_reset.marker (image text PRIMARY KEY);
                          INSERT INTO kritik_reset.marker VALUES (current_setting('kritik.image'));
                        END
                        $reset$;
                        COMMIT;
                        SQL
                    env:
                      - name: IMAGE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.annotations['kritik.nikola.wtf/image']
                      - name: HOME
                        value: /tmp
                      - name: OWNER_URI
                        valueFrom:
                          secretKeyRef:
                            name: kritik-db-owner
                            key: uri
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
