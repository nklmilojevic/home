---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritik
  namespace: kritik
spec:
  interval: 30m
  chart:
    spec:
      chart: ./charts/kritik
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: kritik
  values:
    image:
      tag: main
      digest: sha256:1059c086c4e17a0494c5390ba6b11da815d2354ca3810b03b55eab3c48d79735
    runner:
      image: ghcr.io/home-operations/kritik:main-tools@sha256:ff1928e68f015b45c51c6acaf994611696e0adf9c8afc43f976314e8d95c2c4c
      runtimeClassName: gvisor
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    web:
      url: https://kritik.nikola.wtf
    dashboard:
      keySecret:
        name: kritik-secret
        key: DASHBOARD_KEY
    auth:
      admin:
        passwordSecret:
          name: kritik-secret
          key: ADMIN_PASSWORD
    database:
      owner:
        existingSecret: kritik-db-owner
      app:
        existingSecret: kritik-db-app
      runner:
        existingSecret: kritik-db-runner
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: ""
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
    networkPolicy:
      enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
