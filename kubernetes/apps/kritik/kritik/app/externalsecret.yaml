---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritik
  namespace: kritik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritik-secret
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: kritik
        property: ADMIN_PASSWORD
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef:
        key: kritik
        property: client_id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: kritik
        property: GITHUB_APP_PRIVATE_KEY
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef:
        key: kritik
        property: GITHUB_APP_WEBHOOK_SECRET
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: kritik
        property: OPENROUTER_API_KEY
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritik-db-owner
  namespace: kritik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritik-db-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kritik
        password: "{{ .POSTGRES_OWNER_PASS }}"
        uri: "postgresql://kritik:{{ .POSTGRES_OWNER_PASS }}@kritik-pg-rw.kritik.svc.cluster.local:5432/kritik"
  data:
    - secretKey: POSTGRES_OWNER_PASS
      remoteRef:
        key: kritik
        property: POSTGRES_OWNER_PASS
---
