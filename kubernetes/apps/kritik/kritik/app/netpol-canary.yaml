---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kritik-netpol-canary
  namespace: kritik
spec:
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kritik
            app.kubernetes.io/component: runner
            kritik.home-operations.com/role: runner
        spec:
          restartPolicy: Never
          serviceAccountName: kritik-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: canary
              image: ghcr.io/home-operations/kritik:main-tools@sha256:fb37c15fab5df67c9a4fa0d9434100f8b7db53f288c321dc5467c73fd57ed834
              command:
                - /bin/sh
                - -c
                - |
                  fail=0
                  gw=http://kritik-gateway.kritik.svc.cluster.local:8082
                  expect() {
                    want=$1; name=$2; shift 2
                    "$@" >/dev/null 2>&1; rc=$?
                    case "$want:$rc" in
                      ok:0 | blocked:[!0]* | denied:56) echo "PASS $name (rc=$rc)" ;;
                      *) echo "FAIL $name: want $want, rc=$rc"; fail=1 ;;
                    esac
                  }
                  expect ok dns nslookup kritik-pg-rw.kritik.svc.cluster.local
                  expect ok postgres nc -z -w 5 kritik-pg-rw.kritik.svc.cluster.local 5432
                  expect ok gateway-reachable nc -z -w 5 kritik-gateway.kritik.svc.cluster.local 8082
                  expect denied gateway-denies-unlisted-host curl -sS -m 10 -x "$gw" -o /dev/null https://example.com
                  expect blocked direct-internet curl -sS --noproxy '*' --connect-timeout 5 -m 8 -o /dev/null https://github.com
                  expect blocked direct-ip nc -z -w 5 1.1.1.1 443
                  expect blocked kube-apiserver nc -z -w 5 kubernetes.default.svc.cluster.local 443
                  expect blocked other-namespace nc -z -w 5 versitygw.security.svc.cluster.local 7070
                  exit $fail
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
          runtimeClassName: gvisor
