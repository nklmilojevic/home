---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: descheduler
  values:
    kind: Deployment
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                # Hard-exclude pods annotated with
                # descheduler.alpha.kubernetes.io/prefer-no-eviction
                # (stateful singletons like home-assistant).
                noEvictionPolicy: Mandatory
                podProtections:
                  defaultDisabled:
                    - FailedBarePods
                    - PodsWithLocalStorage
                    - SystemCriticalPods
            - name: LowNodeUtilization
              args:
                metricsUtilization:
                  source: KubernetesMetrics
                # A node is "underutilized" only when ALL resources are below
                # thresholds. On a 3-node cluster the old 20/20/20 was
                # unreachable (every node runs >22 pods and >30% memory), so
                # the plugin never found an eviction target and did nothing.
                # targetThresholds must sit well above steady-state actual
                # usage: kube-scheduler places pods by requests, so a tight
                # target makes evicted pods land back on the same node and
                # loop forever (evicted HA & co every 5m, 2026-08-08).
                # 2026-08-25: raised memory 75 -> 85. The qwen3 model servers
                # lifted icarus001/002 steady-state to ~77-81% actual memory,
                # which re-armed the loop on 2026-08-19 (~40-690 evictions/day
                # for 6 days, ~1200 churned pod names/day) and tripled
                # VictoriaMetrics daily series, filling the vmsingle disk.
                thresholds:
                  cpu: 30
                  memory: 45
                  pods: 60
                targetThresholds:
                  cpu: 70
                  memory: 85
                  pods: 80
                evictionLimits:
                  node: 3
            - name: RemoveFailedPods
              args:
                reasons:
                  - ContainerStatusUnknown
                  - NodeAffinity
                  - NodeShutdown
                  - Terminated
                  - UnexpectedAdmissionError
                includingInitContainers: true
                excludeOwnerKinds:
                  - Job
                minPodLifetimeSeconds: 1800
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemovePodsViolatingTopologySpreadConstraint
            deschedule:
              enabled:
                - RemoveFailedPods
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
