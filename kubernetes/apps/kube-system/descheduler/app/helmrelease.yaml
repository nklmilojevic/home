---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: descheduler
  values:
    kind: Deployment
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                # Hard-exclude pods annotated with
                # descheduler.alpha.kubernetes.io/prefer-no-eviction
                # (stateful singletons like home-assistant).
                noEvictionPolicy: Mandatory
                # Never evict a kopiur mover. They are one-shot Jobs with
                # backoffLimit 2, so a mid-flight eviction fails the whole
                # Snapshot/Restore terminally -- LowNodeUtilization killed the
                # plex restore repeatedly during the 2026-08-04 cutover and it
                # could not finish until the descheduler was stopped. Matters
                # most during the miroir cutover restore, but movers run
                # nightly, so it is live protection now too.
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/managed-by
                      operator: NotIn
                      values: ["kopiur"]
                podProtections:
                  defaultDisabled:
                    - FailedBarePods
                    - PodsWithLocalStorage
                    - SystemCriticalPods
            - name: LowNodeUtilization
              args:
                # Measured by requests, NOT actual usage, and relative to the
                # cluster mean, NOT absolute.
                #
                # Requests because that is what kube-scheduler places by. The
                # old metrics-based config looped twice (2026-08-08, and
                # 2026-08-19 when the qwen3 servers lifted actual memory):
                # a node "overutilized" by actual usage still had the lowest
                # requests, so every evicted pod was scheduled straight back
                # onto it. With both sides counting requests, an evicted pod
                # always lands on the underutilized node.
                #
                # Deviation because absolute targets high enough to dodge that
                # loop (70/85/80) were never reached, so the plugin stopped
                # acting at all. After the Talos 1.14.3/1.14.4 rolling reboots
                # (2026-10-16/17) icarus002 came back with 33 pods against ~85
                # on its peers and stayed that way. Least-allocated scoring
                # then sent nearly every new pod there, including all ~70
                # hourly kopiur movers, whose kopia caches on openebs-hostpath
                # share the system disk with etcd: WAL fsync p99 went from
                # ~2ms to 0.4s and etcdHighCommitDurations fired.
                #
                # Underutilized = below mean - thresholds on every resource;
                # overutilized = above mean + targetThresholds on any. The
                # >=15-point gap between the two bands is what keeps it from
                # oscillating once the nodes are level.
                useDeviationThresholds: true
                thresholds:
                  cpu: 5
                  memory: 10
                  pods: 10
                targetThresholds:
                  cpu: 10
                  memory: 10
                  pods: 10
                evictionLimits:
                  node: 3
            - name: RemoveFailedPods
              args:
                reasons:
                  - ContainerStatusUnknown
                  - NodeAffinity
                  - NodeShutdown
                  - Terminated
                  - UnexpectedAdmissionError
                includingInitContainers: true
                excludeOwnerKinds:
                  - Job
                minPodLifetimeSeconds: 1800
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemovePodsViolatingTopologySpreadConstraint
            deschedule:
              enabled:
                - RemoveFailedPods
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
