---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-token
    creationPolicy: Owner
  data:
    # Same long-lived token the ha-mcp deployment uses; /api/prometheus accepts it.
    - secretKey: token
      remoteRef:
        key: ha-mcp
        property: token
