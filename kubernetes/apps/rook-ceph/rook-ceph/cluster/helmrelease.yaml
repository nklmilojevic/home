---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  labels:
    # Opt out of the centralized rollback remediation (flux/apps.yaml):
    # Ceph mons stamp one-way incompat feature bits into their store on upgrade,
    # so a Helm rollback to an older ceph image crashloops the mons permanently.
    # Never roll back this release; a failed upgrade must be fixed forward.
    flux.home/helm-defaults: skip
spec:
  interval: 30m
  # Mon/OSD rollouts routinely exceed the default 5m wait; a false timeout here
  # is what previously triggered the destructive rollback.
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0 # no automatic remediation — never roll back ceph
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.nikola.wtf
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
        mgr:
          mgr/crash/warn_recent_interval: "7200" # 2h
          # The active mgr logs the rook module's 15s PodList poll in full at
          # DEBUG (~583KB/line, prio 0 — no log-level knob suppresses it, see
          # mgr_module.py MgrRootHandler). At the 10000-entry default, the
          # in-memory recent-events ring retains those lines and the mgr walks
          # into its 4Gi limit every ~33h, gets OOM-killed and fails over.
          log_max_recent: "200" # quote
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-vmetrics-victoria-metrics-k8s-stack.o11y.svc.cluster.local:8429
      # Tentacle (CVE-2025-30156) marks legacy "aes" cephx keys insecure. The
      # daemon keys (mon/mgr/osd/exporter/crash/admin) are already rotated to
      # aes256k at keyGeneration 2 and the monmap issues aes256k service
      # tickets (auth_service_cipher aes256k), so the two _ERR checks and
      # AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE do not fire — no mute needed.
      # CSI/client keys must STAY aes until the nodes run a kernel with
      # aes256k cephx support (krbd does cephx in-kernel; support landed in
      # Linux 7.0, Talos is on 6.18) — rotating them now breaks every RBD
      # mount. That keeps "aes" in monmap auth_allowed_ciphers, which is what
      # the three mutes below cover; upstream explicitly recommends muting
      # AUTH_INSECURE_CLIENT_KEY_TYPE while legacy clients exist.
      # RECENT_MGR_MODULE_CRASH stays muted as a backstop for the rook-module
      # crash spam (see mgr.modules below) so it cannot fail the tuppr
      # CephCluster health gate; the mute does not hide the Prometheus alert,
      # which reads ceph_health_detail regardless of mutes.
      # Unmute the AUTH_* ones after kernel 7.0 + client key rotation.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
          RECENT_MGR_MODULE_CRASH:
            policy: mute
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          # The rook orchestrator module is disabled on purpose. It has caused
          # two separate outages on Tentacle: its 15s PodList poll floods the
          # mgr recent-events ring (see log_max_recent above), and every
          # prometheus scrape calls get_hardware_metrics() ->
          # node_proxy_fullreport(), which the rook backend does not implement.
          # Each NotImplementedError is recorded as a crash report (~3.3k in
          # 16h), and the crash module then dies iterating its own growing dict
          # ("dictionary changed size during iteration") -> MGR_MODULE_ERROR ->
          # HEALTH_ERR, which blocks the tuppr CephCluster health check and
          # stalls Kubernetes/Talos upgrades. Nothing in the provisioning path
          # needs this module; only the dashboard's host/inventory pages and
          # `ceph orch` lose function. Re-enable once upstream implements (or
          # stubs) node_proxy_fullreport for the rook backend.
          - name: rook
            enabled: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 4Gi
        mon:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 6Gi
        mgr-sidecar:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      storage:
        useAllNodes: true
        useAllDevices: false
        # Match by stable by-id path: /dev/nvmeXnY enumeration shifts across
        # reboots. Two models now — icarus003's RS1D0TSSD710 died on
        # 2026-08-29 (NVMe controller stopped enumerating on the PCI bus
        # entirely) and was replaced with a Kingston OM8PGP4. The alternation
        # must keep matching the two surviving RS1D0TSSD710 drives, and it
        # deliberately does NOT match any system disk: icarus001/002 boot from
        # KINGSTON_SNV*, icarus003 from a SATA disk.
        devicePathFilter: "^/dev/disk/by-id/nvme-(RS1D0TSSD710|KINGSTON_OM8PGP41024Q-A0)_.*"
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            imageFormat: "2"
            # ON TRIAL as of 2026-08-28 — re-enabled deliberately, NOT settled.
            # The 2026-08-05..07 incident was worse than "enabled them wrong":
            # with these features active, fresh corruption kept appearing
            # BETWEEN nightly snapshots on this same kernel (krbd lock
            # transitions during snapshot creation dropping in-flight writes,
            # ~4 volumes a night), and the fleet-wide repair found 39 of 52
            # volumes needing e2fsck. That is why it was reverted to
            # layering-only. Nodes still run 6.18.46-talos, the same krbd.
            # This time every existing image was converted while unmapped with
            # `rbd status` showing zero watchers, which rules out one of the two
            # failure modes but NOT the snapshot-lock one. If clone mounts start
            # failing fsck or volsync backups fail, revert immediately — and
            # note that a live `rbd feature disable` is equally destructive, so
            # the revert must also be done offline.
            # deep-flatten is set here because it can only be chosen at image
            # creation, so it applies to new volumes only — images converted in
            # place carry the other three (rbd rejects deep-flatten with EINVAL
            # on an existing image).
            imageFeatures: layering,exclusive-lock,object-map,fast-diff,deep-flatten
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems: []
    cephObjectStores: []
