---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  labels:
    # Opt out of the centralized rollback remediation (flux/apps.yaml):
    # Ceph mons stamp one-way incompat feature bits into their store on upgrade,
    # so a Helm rollback to an older ceph image crashloops the mons permanently.
    # Never roll back this release; a failed upgrade must be fixed forward.
    flux.home/helm-defaults: skip
spec:
  interval: 30m
  # Mon/OSD rollouts routinely exceed the default 5m wait; a false timeout here
  # is what previously triggered the destructive rollback.
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0 # no automatic remediation — never roll back ceph
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.nikola.wtf
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
        mgr:
          mgr/crash/warn_recent_interval: "7200" # 2h
          # The active mgr logs the rook module's 15s PodList poll in full at
          # DEBUG (~583KB/line, prio 0 — no log-level knob suppresses it, see
          # mgr_module.py MgrRootHandler). At the 10000-entry default, the
          # in-memory recent-events ring retains those lines and the mgr walks
          # into its 4Gi limit every ~33h, gets OOM-killed and fails over.
          log_max_recent: "200" # quote
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-vmetrics-victoria-metrics-k8s-stack.o11y.svc.cluster.local:8429
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 4Gi
        mon:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 6Gi
        mgr-sidecar:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      storage:
        useAllNodes: true
        useAllDevices: false
        # Data disks are all the same model; match by stable by-id path since
        # /dev/nvmeXnY enumeration shifts across reboots (icarus003 is nvme0n1)
        devicePathFilter: "^/dev/disk/by-id/nvme-RS1D0TSSD710_.*"
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            imageFormat: "2"
            # layering ONLY. exclusive-lock+object-map+fast-diff caused ongoing
            # data corruption around snapshot lock transitions with krbd
            # (2026-08-05..07 incident) — do not re-enable.
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems: []
    cephObjectStores: []
