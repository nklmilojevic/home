---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: github-nklmilojevic
  namespace: renovate
spec:
  discoveryFilters:
    - nklmilojevic/*
  # Repos opt in with the `renovate` topic, so discovery never schedules a pod
  # for the rest. A tagged repo without a config is skipped quietly instead of
  # getting an onboarding PR.
  discoverTopics:
    - renovate
  skipForks: true
  extraEnv:
    - name: RENOVATE_ONBOARDING
      value: "false"
    - name: RENOVATE_REQUIRE_CONFIG
      value: required
    # postUpgradeTasks commands repos may run (templ codegen, go-vendor-hash); anything else is refused.
    # go-vendor-hash is pinned to a renovate-config commit: bumping the helper means bumping the sha
    # both here and in renovate-config's go-vendor-hash.json. 2ccac4d stays allowed until every repo
    # runs c974b98; repos with the hash outside package.nix pass "-- <file> <attr>" (thurm).
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["^go tool templ generate( -path [\\w/.-]+)?$", "^nix --extra-experimental-features nix-command --extra-experimental-features flakes run git\\+https://github\\.com/nklmilojevic/renovate-config\\?rev=(2ccac4df935f18066002b388984c33a5c5d11d45|c974b980f9aab67262dc37b8c56dffed784e54ef)#go-vendor-hash( -- [\\w.#/-]+ [\\w.#/-]+)?$"]'
  # containerbase's nix keeps its store below /tmp/containerbase, which binary caches can't serve.
  # go-vendor-hash builds against /nix/store on this volume instead, so it substitutes from
  # cache.nixos.org rather than bootstrapping the toolchain from source.
  extraVolumes:
    - name: nix
      emptyDir:
        sizeLimit: 8Gi
  extraVolumeMounts:
    - name: nix
      mountPath: /nix
  image: ghcr.io/renovatebot/renovate:44.262.0
  parallelism: 3
  provider:
    name: github
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  schedule: 0 * * * *
  secretRef: renovate-secret
  webhook:
    enabled: true
    authentication:
      enabled: false
