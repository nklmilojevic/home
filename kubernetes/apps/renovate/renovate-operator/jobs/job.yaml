---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: github-nklmilojevic
  namespace: renovate
spec:
  discoveryFilters:
    - nklmilojevic/*
  # Repos opt in with the `renovate` topic, so discovery never schedules a pod
  # for the rest. A tagged repo without a config is skipped quietly instead of
  # getting an onboarding PR.
  discoverTopics:
    - renovate
  skipForks: true
  extraEnv:
    - name: RENOVATE_ONBOARDING
      value: "false"
    - name: RENOVATE_REQUIRE_CONFIG
      value: required
    # postUpgradeTasks commands repos may run; anything else is refused.
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["^go tool templ generate( -path [\\w/.-]+)?$"]'
  image: ghcr.io/renovatebot/renovate:44.192.0
  parallelism: 3
  provider:
    name: github
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  schedule: 0 * * * *
  secretRef: renovate-secret
  webhook:
    enabled: true
    authentication:
      enabled: false
