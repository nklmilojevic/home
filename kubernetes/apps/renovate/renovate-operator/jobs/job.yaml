---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: github-nklmilojevic
  namespace: renovate
spec:
  discoveryFilters:
    - nklmilojevic/*
  skipForks: true
  # Repos opt in with their own renovate config; the rest are skipped quietly
  # instead of getting an onboarding PR.
  extraEnv:
    - name: RENOVATE_ONBOARDING
      value: "false"
    - name: RENOVATE_REQUIRE_CONFIG
      value: required
  image: ghcr.io/renovatebot/renovate:44.172.0
  parallelism: 3
  provider:
    name: github
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  schedule: 0 * * * *
  secretRef: renovate-secret
  webhook:
    enabled: true
    authentication:
      enabled: false
