---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atuin
spec:
  components:
    - ../../../../components/kopiur/volume
    - ../../../../components/kopiur/backup
  targetNamespace: security
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  path: ./kubernetes/apps/security/atuin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  interval: 15m
  retryInterval: 1m
  timeout: 3m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: atuin-config
      KOPIUR_CAPACITY: 10Gi
      APP_UID: "1000"
      APP_GID: "1000"
