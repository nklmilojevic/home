---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: versitygw
  namespace: security
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: versitygw
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      versitygw:
        annotations:
          secret.reloader.stakater.com/reload: versitygw-secret
        containers:
          app:
            image:
              repository: ghcr.io/versity/versitygw
              tag: v1.7.0@sha256:c4cbd9d9cb8dedbb055ac788dbd02635651b9b1cebac95b095b3217231aa87ad
            # Stateless POSIX gateway: buckets are directories under /data and
            # objects are plain files on the NFS share, so nothing but the share
            # itself has to survive. Deliberately not Garage, which would need a
            # durable LMDB metadata index kept off Ceph for the local restore
            # path to survive a Ceph outage.
            args:
              - posix
              - /data
            env:
              TZ: Europe/Belgrade
              VGW_HEALTH: /healthz
            envFrom:
              - secretRef:
                  name: versitygw-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7070
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: versitygw
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - s3.nikola.wtf
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      # The share is named "garage" from an earlier plan to run Garage here;
      # the gateway in front of it is versitygw. Path kept as created.
      data:
        type: nfs
        server: "10.5.0.10"
        path: "/var/nfs/shared/garage"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
