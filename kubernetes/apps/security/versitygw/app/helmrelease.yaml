---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: versitygw
  namespace: security
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: versitygw
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      versitygw:
        annotations:
          secret.reloader.stakater.com/reload: versitygw-secret
        containers:
          app:
            image:
              repository: ghcr.io/versity/versitygw
              tag: v1.7.0@sha256:c4cbd9d9cb8dedbb055ac788dbd02635651b9b1cebac95b095b3217231aa87ad
            # Stateless POSIX gateway: buckets are directories under /data and
            # objects are plain files on the NFS share, so nothing but the share
            # itself has to survive. Deliberately not Garage, which would need a
            # durable LMDB metadata index kept off Ceph for the local restore
            # path to survive a Ceph outage.
            args:
              - posix
              - /data
            env:
              TZ: Europe/Belgrade
              VGW_HEALTH: /healthz
              # The posix backend stores S3 object metadata in xattrs by default
              # and refuses to start without them ("xattr check failed: xattrs are
              # not supported on this filesystem") — the UNAS NFS export has none.
              # The sidecar store keeps that metadata as plain files mirroring the
              # object namespace instead. It must be a sibling of the data dir,
              # not inside it, or it would surface as a bucket named "meta" and
              # collide with the sidecar's own layout.
              VGW_META_SIDECAR: /meta
              # New objects are written via O_TMPFILE, which NFS has no protocol
              # support for; without this every PUT fails.
              VGW_DISABLE_OTMP: "true"
            envFrom:
              - secretRef:
                  name: versitygw-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7070
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: versitygw
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # / is the S3 ListBuckets API and returns 403 to unauthenticated
          # requests; probe the unauthenticated health endpoint instead.
          gatus.home-operations.com/endpoint: |
            url: https://s3.nikola.wtf/healthz
        hostnames:
          - s3.nikola.wtf
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      # The share is named "garage" from an earlier plan to run Garage here;
      # the gateway in front of it is versitygw. Path kept as created.
      # Buckets and sidecar metadata are siblings under the share root, and both
      # directories must already exist — versitygw stats the sidecar dir at
      # startup and will not create it.
      data:
        type: nfs
        server: "10.5.0.10"
        path: "/var/nfs/shared/garage/data"
        globalMounts:
          - path: /data
      meta:
        type: nfs
        server: "10.5.0.10"
        path: "/var/nfs/shared/garage/meta"
        globalMounts:
          - path: /meta
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
