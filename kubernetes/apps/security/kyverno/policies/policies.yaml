---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-requests
  annotations:
    policies.kyverno.io/title: Require Resource Requests
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  background: true
  emitWarning: true
  rules:
    - name: require-resource-requests
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: CPU and memory requests are required for all containers.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
            "=(initContainers)":
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
            "=(ephemeralContainers)":
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  background: true
  emitWarning: true
  rules:
    - name: disallow-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: Privileged containers are not allowed.
        pattern:
          spec:
            containers:
              - "=(securityContext)":
                  "=(privileged)": false
            "=(initContainers)":
              - "=(securityContext)":
                  "=(privileged)": false
            "=(ephemeralContainers)":
              - "=(securityContext)":
                  "=(privileged)": false
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: Privilege escalation must be explicitly disabled.
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
            "=(initContainers)":
              - securityContext:
                  allowPrivilegeEscalation: false
            "=(ephemeralContainers)":
              - securityContext:
                  allowPrivilegeEscalation: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  background: true
  emitWarning: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: Pod or container security contexts must explicitly require a non-root user.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              containers:
                - "=(securityContext)":
                    "=(runAsNonRoot)": true
              "=(initContainers)":
                - "=(securityContext)":
                    "=(runAsNonRoot)": true
              "=(ephemeralContainers)":
                - "=(securityContext)":
                    "=(runAsNonRoot)": true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
              "=(initContainers)":
                - securityContext:
                    runAsNonRoot: true
              "=(ephemeralContainers)":
                - securityContext:
                    runAsNonRoot: true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digests
  annotations:
    policies.kyverno.io/title: Require Image Digests
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  background: true
  emitWarning: true
  rules:
    - name: require-image-digests
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: Container images must be pinned to immutable digests.
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"
            "=(initContainers)":
              - image: "*@sha256:*"
            "=(ephemeralContainers)":
              - image: "*@sha256:*"
