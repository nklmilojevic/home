---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victorialogs
  namespace: o11y
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: victorialogs
  values:
    server:
      enabled: true
      podAnnotations:
        descheduler.alpha.kubernetes.io/prefer-no-eviction: "true"
      extraArgs:
        envflag.enable: "true"
        envflag.prefix: VM_
        loggerFormat: json

      resources:
        requests:
          cpu: 50m
          memory: 768Mi
        limits:
          memory: 2Gi

      persistentVolume:
        enabled: true
        accessModes:
          - ReadWriteOnce
        storageClass: ""
        existingClaim: ""
        size: 20Gi

      service:
        enabled: true
        externalIPs: []
        loadBalancerIP: ""
        loadBalancerSourceRanges: []
        servicePort: 9428
        type: ClusterIP

      serviceMonitor:
        enabled: true

      statefulSet:
        enabled: true
        podManagementPolicy: OrderedReady
        service:
          enabled: true
          annotations: {}
          labels: {}
          servicePort: 9428
