---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: home-assistant
spec:
  allowCrossNamespaceImport: true
  resyncPeriod: 1m
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: home-assistant-dashboard
    key: home-assistant-dashboard.json
