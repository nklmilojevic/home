---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: immich
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
    # VictoriaLogs is not Loki-compatible; the couple of log panels in this
    # dashboard will stay empty, the metric panels all use DS_PROMETHEUS.
    - inputName: DS_LOKI
      datasourceName: VictoriaLogs
  # renovate: dashboardName="Immich Overview"
  grafanaCom:
    id: 22555
    revision: 1
