---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: immich
spec:
  allowCrossNamespaceImport: true
  resyncPeriod: 1m
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
  # Vendored from grafana.com dashboard 22555 rev 1 ("Immich Overview") with
  # two fixes: service_name is "immich" here (not the helm chart's
  # "immich-server"), and the Loki log panel is removed (VictoriaLogs is not
  # LogQL-compatible).
  configMapRef:
    name: immich-dashboard
    key: immich-dashboard.json
