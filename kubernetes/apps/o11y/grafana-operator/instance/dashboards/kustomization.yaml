---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ceph.yaml
  - ./apps.yaml
  - ./kubernetes.yaml
  - ./monitoring.yaml
  - ./network.yaml
  - ./sleep.yaml
  - ./unas.yaml
  - ./ups.yaml
  - ./unifi.yaml
  - ./victoriametrics.yaml
configMapGenerator:
  - name: sleep-dashboard
    files:
      - sleep-dashboard.json
  - name: unas-dashboard
    files:
      - unas-dashboard.json
  - name: ups-dashboard
    files:
      - ups-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
