---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

# Gatus alerts Telegram directly — independent of the vmalert->alertmanager
# chain, so it still fires when the monitoring stack itself is down.
alerting:
  telegram:
    token: "${GATUS_TELEGRAM_TOKEN}"
    id: "104243855"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: vmsingle-vmetrics
    group: monitoring
    url: http://vmsingle-vmetrics-victoria-metrics-k8s-stack.o11y.svc.cluster.local:8428/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: vmsingle-health
    group: monitoring
    url: http://vmsingle-health.o11y.svc.cluster.local:8429/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: vmalert
    group: monitoring
    url: http://vmalert-vmetrics-victoria-metrics-k8s-stack.o11y.svc.cluster.local:8080/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram

  - name: alertmanager
    group: monitoring
    url: http://vmalertmanager-vmetrics-victoria-metrics-k8s-stack.o11y.svc.cluster.local:9093/-/healthy
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | nikola.wtf
  header: Status
  link: https://github.com/nklmilojevic
  buttons:
    - name: Github
      link: https://github.com/nklmilojevic
    - name: Homelab
      link: https://github.com/nklmilojevic/home

web:
  port: ${GATUS_WEB_PORT}
