---
data_dir: /vector-data-dir

sources:
  mikrotik_source:
    type: syslog
    address: 0.0.0.0:1514
    max_length: 102400
    mode: udp
    permit_origin:
      - 10.0.0.0/8
  k8s_source:
    type: kubernetes_logs
  internal_metrics_source:
    type: internal_metrics
sinks:
  mikrotik:
    type: vector
    compression: true
    version: "2"
    address: vector-aggregator.o11y.svc.cluster.local:6000
    inputs: ["mikrotik_source"]
  k8s:
    type: vector
    compression: true
    version: "2"
    address: vector-aggregator.o11y.svc.cluster.local:6001
    inputs: ["k8s_source"]
  prometheus_exporter:
    type: prometheus_exporter
    inputs: ["internal_metrics_source"]
    address: 0.0.0.0:9598
