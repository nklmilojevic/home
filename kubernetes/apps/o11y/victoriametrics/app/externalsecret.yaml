---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmalert-telegram-token
  namespace: o11y
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vmalert-telegram-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: vmalert-telegram-token
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmalert-ha-webhook
  namespace: o11y
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vmalert-ha-webhook
    creationPolicy: Owner
  data:
    # Home Assistant webhook that lights AWTRIX indicator 1 and shows an ALERT
    # screen. Kept in 1Password rather than inline because this repo is public
    # and an HA webhook endpoint is unauthenticated by URL.
    - secretKey: url
      remoteRef:
        key: vmalert-ha-webhook
        property: password
