---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nut-exporter
  namespace: o11y
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: nut-exporter
  values:
    controllers:
      nut-exporter:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: "3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a"
            env:
              TZ: "Europe/Belgrade"
              NUT_EXPORTER_SERVER: "network-ups-tools.o11y.svc"
              NUT_EXPORTER_VARIABLES: "battery.charge,battery.low,battery.runtime,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,input.frequency,input.transfer.high,input.transfer.low,output.voltage,output.current,output.frequency,output.powerfactor,ups.load,ups.power,ups.power.nominal,ups.realpower,ups.realpower.nominal,ups.temperature,ups.status"
            resources:
              requests:
                cpu: 15m
                memory: 30Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: nut-exporter
        ports:
          metrics:
            port: 9199
    serviceMonitor:
      nut-exporter:
        serviceName: nut-exporter
        endpoints:
          - port: metrics
            scheme: http
            path: /ups_metrics
            interval: 1m
            scrapeTimeout: 30s
