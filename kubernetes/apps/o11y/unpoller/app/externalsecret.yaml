---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unpoller-secret
    template:
      data:
        UP_UNIFI_DEFAULT_API_KEY: "{{ .UNIFI_API_KEY }}"
        UP_UNAS_DEVICE_0_USER: "{{ .UNAS_USER }}"
        UP_UNAS_DEVICE_0_PASS: "{{ .UNAS_PASS }}"
  data:
    - secretKey: UNAS_USER
      remoteRef:
        key: unas
        property: username
    - secretKey: UNAS_PASS
      remoteRef:
        key: unas
        property: password
  dataFrom:
    - extract:
        key: unifi
