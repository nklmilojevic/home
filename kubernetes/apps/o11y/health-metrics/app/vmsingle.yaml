---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: health
spec:
  # Deliberately separate from the k8s-stack vmsingle, which runs a 1-month
  # retention (~13GB on disk for that one month). VictoriaMetrics drops samples
  # whose timestamp falls outside the retention window at ingestion time
  # (vm_rows_ignored_total{reason="too_small_timestamp"}), so backfilled Apple
  # Health history from 2019 cannot land there. Raising that instance's retention
  # far enough would cost ~1TB, and per-metric retention (-retentionFilter) plus
  # downsampling are both Enterprise-only. This instance holds ~14k hand-imported
  # samples (~0.3MB) instead.
  retentionPeriod: "100y"
  removePvcAfterDelete: false
  extraArgs:
    # Makes re-running the importer idempotent: repeat samples landing on the same
    # per-night timestamp collapse to the last one instead of stacking up.
    dedup.minScrapeInterval: 1m
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: miroir
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: vmsingle-health-bootstrap
    resources:
      requests:
        storage: 1Gi
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      # 512Mi got OOMKilled. The dataset is tiny, but 100y retention means one
      # monthly partition per month of history (~88 of them for 2019-2026), each
      # holding index structures, and VictoriaMetrics sizes its caches off the
      # cgroup limit — so the floor is set by partition count, not sample count.
      # delete_series reindexing is the peak.
      memory: 1Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: vmsingle-health-bootstrap
  namespace: o11y
spec:
  # The VMSingle operator creates this claim, so the kopiur volume Component
  # never covers it -- without an explicit populator it comes back EMPTY and
  # silently loses the 100y series (Apple Health back to 2019), which the
  # 1-month cluster instance cannot re-ingest.
  mover:
    cache:
      capacity: 2Gi
      mode: Persistent
      storageClassName: openebs-hostpath
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: vmsingle-health-local
      offset: 1
  target:
    populator: {}
