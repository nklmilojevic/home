---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meridian
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: meridian
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Long-lived token from `claude setup-token`; the same one bastion used
        # to carry. Meridian feeds it to the Agent SDK as CLAUDE_CODE_OAUTH_TOKEN.
        MERIDIAN_PROFILES: '[{"id":"nikola","oauthToken":"{{ .CLAUDE_CODE_OAUTH_TOKEN }}"}]'
        # Shared secret between LiteLLM and Meridian. Not an Anthropic key.
        MERIDIAN_API_KEY: "{{ .MERIDIAN_API_KEY }}"
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: bastion
        property: CLAUDE_CODE_OAUTH_TOKEN
    - secretKey: MERIDIAN_API_KEY
      remoteRef:
        key: litellm
        property: meridian_api_key
