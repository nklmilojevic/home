---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cliproxyapi
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          config-version: 8
          server:
            port: 8317
          management:
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              - "{{ .api_key }}"
          oauth:
            auth-dir: /data/auths
          routing:
            strategy: fill-first
  data:
    - secretKey: api_key
      remoteRef:
        key: cliproxyapi
        property: api_key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-seed
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cliproxyapi-seed
    creationPolicy: Owner
  data:
    - secretKey: codex.json
      remoteRef:
        key: cliproxyapi
        property: codex_auth
