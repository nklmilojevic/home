---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm
    creationPolicy: Owner
  data:
    # Protects the proxy API, not an OpenAI API key. Use a strong sk- prefixed value.
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: master_key
    # Shared secret LiteLLM presents to the Meridian Claude bridge.
    - secretKey: MERIDIAN_API_KEY
      remoteRef:
        key: litellm
        property: meridian_api_key
