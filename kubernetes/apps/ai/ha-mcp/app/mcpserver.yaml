---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ha-mcp
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/homeassistant-ai/ha-mcp:9.1.0@sha256:4259f24727d2052d80d57f4789f97371ea3c7a4dd3060bbb3c61b5ee33f6678e
  transport: streamable-http
  env:
    - name: HOMEASSISTANT_URL
      value: http://home-assistant-app.home.svc.cluster.local:8123
  secrets:
    - name: ha-mcp-secret
      key: HOMEASSISTANT_TOKEN
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command:
            - ha-mcp-web
          volumeMounts:
            - name: tmpfs
              mountPath: /tmp
      volumes:
        - name: tmpfs
