---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: victorialogs-mcp
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/victoriametrics/mcp-victorialogs:v1.11.0@sha256:0b3acd058159adc196ace66b2168895d4fbe6cb2ed75bbad49799863ac4dc56e
  transport: streamable-http
  mcpPort: 8081
  env:
    - name: VL_INSTANCE_ENTRYPOINT
      value: http://victorialogs-victoria-logs-single-server.o11y.svc.cluster.local:9428
    - name: MCP_SERVER_MODE
      value: http
    - name: MCP_LISTEN_ADDR
      value: 0.0.0.0:8081
    - name: MCP_LOG_FORMAT
      value: json
    # Avoid logging complete MCP responses, which can exceed VictoriaLogs' line limit.
    - name: MCP_LOG_LEVEL
      value: warn
    # v1.9.0 cannot disable resources; avoid loading its documentation search index.
    - name: MCP_DISABLED_TOOLS
      value: documentation
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: tmpfs
              mountPath: /tmp
      volumes:
        - name: tmpfs
          emptyDir:
            sizeLimit: 64Mi
