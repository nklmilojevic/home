---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-mcp
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/sirkirby/unifi-network-mcp:0.32.8@sha256:325c87e977f4b807b867740e2ab68114d0968786fc005e86d1f1645ce73a70ec
  transport: streamable-http
  mcpPort: 3000
  env:
    - name: UNIFI_NETWORK_HOST
      value: "10.5.0.1"
    - name: UNIFI_NETWORK_SITE
      value: default
    # The image speaks stdio by default; HTTP is opt-in and binds to loopback
    # unless told otherwise. The toolhive proxy forwards the in-cluster service
    # Host header, which the default DNS-rebinding allow-list rejects.
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_FORCE
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    - name: UNIFI_MCP_HOST
      value: "0.0.0.0"
    - name: UNIFI_MCP_PORT
      value: "3000"
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          # spec.secrets is a list keyed by secret name, so it cannot pull two
          # keys from the same Secret; envFrom injects both.
          envFrom:
            - secretRef:
                name: unifi-mcp-secret
          volumeMounts:
            - name: tmpfs
              mountPath: /tmp
      volumes:
        - name: tmpfs
          emptyDir:
            sizeLimit: 64Mi
