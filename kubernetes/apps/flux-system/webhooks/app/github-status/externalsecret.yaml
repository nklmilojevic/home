---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-status-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: github-status-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: flux-github-status
        property: token
