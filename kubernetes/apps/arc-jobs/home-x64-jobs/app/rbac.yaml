---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-x64-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-x64-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-x64-runner
subjects:
  - kind: ServiceAccount
    name: home-x64-runner
    namespace: arc-runners
