---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
spec:
  components:
    - ../../../../components/kopiur/volume
    - ../../../../components/kopiur/backup
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/jellyfin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: false
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
    - name: external-secrets-stores
      namespace: security
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: jellyfin-config
      KOPIUR_CAPACITY: 20Gi
      # jellyfin is the one app the fleet-wide 2026-08-31T00:00Z cutoff does not
      # work for. asOf resolves against kopia directly, not the catalog, and the
      # repository holds a snapshot pinned 2026-08-29T12:11 that has no Snapshot
      # CR and whose content blobs are gone -- resolution picked that one and
      # failed with `content 9075e82f... not found`, even though the catalogued
      # 2026-08-30T23:37 snapshot is newer and inside the cutoff. Narrowing the
      # window to just after that snapshot lands on it instead.
      KOPIUR_RESTORE_ASOF: "2026-08-30T23:40:00Z"
