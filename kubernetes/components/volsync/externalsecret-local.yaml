---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-volsync-local"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: "${APP}-volsync-local"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # One `volsync` bucket on the NFS-backed gateway, one prefix per app.
        # Points at the Service, not s3.nikola.wtf: Envoy buffers request bodies
        # and restic packs are tens of MB, so backup traffic has no business
        # going through the gateway.
        RESTIC_REPOSITORY: "s3:http://versitygw.security.svc.cluster.local:7070/volsync/${APP}"
        # Same restic password as the R2 repo — the repos are independent, and
        # one password means one thing to keep safe rather than two.
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: volsync-r2-template
        property: RESTIC_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: versitygw
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: versitygw
        property: secret_access_key
