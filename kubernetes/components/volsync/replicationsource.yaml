---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${APP}-r2
spec:
  sourcePVC: "${VOLSYNC_CLAIM:-${APP}}"
  trigger:
    # Staggered per app (VOLSYNC_SCHEDULE in each ks.yaml) so 46 sources do not
    # all snapshot+clone at once — that burst is what pushed osd.2 into
    # BlueStore slow ops on 2026-08-29.
    schedule: "${VOLSYNC_SCHEDULE:-0 0 * * *}"
  restic:
    cacheAccessModes:
      - "${VOLSYNC_CACHE_ACCESSMODES:-ReadWriteOnce}"
    cacheCapacity: "${VOLSYNC_CACHE_CAPACITY:-1Gi}"
    cacheStorageClassName: "${VOLSYNC_CACHE_SNAPSHOTCLASS:-openebs-hostpath}"
    copyMethod: Snapshot
    moverSecurityContext:
      runAsUser: ${APP_UID:-1000}
      runAsGroup: ${APP_GID:-1000}
      fsGroup: ${APP_GID:-1000}
    pruneIntervalDays: 7
    repository: ${APP}-volsync-r2
    retain:
      daily: 7
    storageClassName: "${VOLSYNC_STORAGECLASS:-ceph-block}"
    volumeSnapshotClassName: "${VOLSYNC_SNAPSHOTCLASS:-csi-ceph-blockpool}"
