---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${APP}-bootstrap"
spec:
  mover:
    # Ephemeral, NOT Persistent: a persistent cache is a node-local PVC that
    # binds once and pins the mover to that node forever. That broke backups
    # twice on 2026-08-30 -- 80 caches stranded when icarus003 went down, then
    # hermes deadlocked with its cache on icarus003 and its staging clone on
    # icarus001, so no node could satisfy both. Staging clones can only land on
    # diskful nodes; caches can land anywhere, so the two drift apart.
    # Costs a kopia metadata re-download per run; over the LAN that is cheap
    # next to a backup that cannot schedule at all.
    cache:
      # 10Gi, not 1Gi. A restore streams every content blob it touches through
      # this cache, so 1Gi fills partway into any multi-GB volume and kopia then
      # spams `PutBlobInPath ... no space left on device` per blob, retrying each
      # one twice. It limps to completion on small volumes and wastes the whole
      # transfer on large ones. Ephemeral and on miroir-local, so this costs
      # nothing once the mover exits.
      capacity: "${KOPIUR_CACHE_CAPACITY:-10Gi}"
      mode: Ephemeral
      storageClassName: "${KOPIUR_CACHE_SNAPSHOTCLASS:-miroir-local}"
    securityContext:
      runAsUser: ${APP_UID:-1000}
      runAsGroup: ${APP_GID:-1000}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      # Restore from the LAN repository — 91 GiB at ~200 MB/s rather than
      # pulling it back from Cloudflare.
      name: "${APP}-local"
  target:
    populator: {}
