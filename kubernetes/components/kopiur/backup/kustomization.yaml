---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Additive only: policies and schedules, no PVC ownership. Safe to run
# alongside volsync during the parallel phase — the PVC/populator flip lives in
# ../volume and is wired in at the miroir cutover.
#
# Deliberately reads the existing VOLSYNC_* postBuild vars rather than adding a
# parallel KOPIUR_* set to 46 ks.yaml files: during the parallel run both stacks
# describe the same claims, so wiring an app is one `components:` line. The
# rename happens in one pass at cutover, when volsync goes away.
resources:
  - ./snapshotpolicy.yaml
  - ./snapshotschedule.yaml
  - ./snapshotpolicy-r2.yaml
  - ./snapshotschedule-r2.yaml
