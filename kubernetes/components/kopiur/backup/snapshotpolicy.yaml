---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}-local"
spec:
  # LAN copy on versitygw. This is the one the miroir cutover restores from,
  # so it is seeded first and kept current.
  compression:
    compressor: zstd
  mover:
    # Ephemeral, NOT Persistent: a persistent cache is a node-local PVC that
    # binds once and pins the mover to that node forever. That broke backups
    # twice on 2026-08-30 -- 80 caches stranded when icarus003 went down, then
    # hermes deadlocked with its cache on icarus003 and its staging clone on
    # icarus001, so no node could satisfy both. Staging clones can only land on
    # diskful nodes; caches can land anywhere, so the two drift apart.
    # Costs a kopia metadata re-download per run; over the LAN that is cheap
    # next to a backup that cannot schedule at all.
    cache:
      # miroir-local, NOT openebs-hostpath. A mover needs its kopia cache and
      # its staging clone on ONE node. Both are RWO and WaitForFirstConsumer,
      # but they were provisioned by different drivers: miroir places the clone
      # where the source data lives, while an openebs-hostpath cache follows
      # whatever node the scheduler picked. When those disagree the pod is
      # unschedulable and the snapshot fails after the 300s startup deadline:
      #   0/3 nodes are available: 3 node(s) didn't match PersistentVolume's
      #   node affinity
      # Putting the cache on the same driver as the staging clone makes the two
      # placements coherent by construction, which is why the upstream repos
      # running kopiur (e.g. Diaoul/home-ops) need no mover nodeSelector,
      # affinity or sourceColocation at all.
      capacity: "${KOPIUR_CACHE_CAPACITY:-5Gi}"
      mode: Ephemeral
      storageClassName: "${KOPIUR_CACHE_SNAPSHOTCLASS:-miroir-local}"
    securityContext:
      runAsUser: ${APP_UID:-1000}
      runAsGroup: ${APP_GID:-1000}
  repository:
    kind: ClusterRepository
    name: local
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  staging:
    # The staged clone is ephemeral, read-only and discarded minutes later, so
    # it does not need replication. At the default 3 replicas EVERY staging
    # clone touches ALL THREE nodes, which means one degraded node fails every
    # snapshot in the fleet -- exactly what happened on 2026-08-29 when the
    # icarus003 agent OOMed and left LVs without device nodes. One replica also
    # cuts the per-snapshot LVM/DRBD work by ~3x, which is what drove the OOM.
    storageClassName: miroir-local
    # Concurrent DRBD lockstep snapshots (or a post-reboot resync) can exceed
    # the 10m default and fail the whole backup.
    timeout: 30m
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:-miroir}"
