---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}"
spec:
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: "${KOPIUR_CACHE_CAPACITY:-1Gi}"
      mode: Persistent
      storageClassName: "${KOPIUR_CACHE_STORAGECLASS:-openebs-hostpath}"
    securityContext:
      runAsUser: ${APP_UID:-1000}
      runAsGroup: ${APP_GID:-1000}
  repository:
    kind: ClusterRepository
    name: r2
  retention:
    keepLatest: 3
    keepDaily: 7
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:-miroir}"
