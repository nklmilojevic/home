---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}-local"
spec:
  # LAN copy on versitygw. This is the one the miroir cutover restores from,
  # so it is seeded first and kept current.
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: "${KOPIUR_CACHE_CAPACITY:-5Gi}"
      contentCacheSizeMb: 1000
      metadataCacheSizeMb: 2000
      mode: Persistent
      storageClassName: "${KOPIUR_CACHE_SNAPSHOTCLASS:-miroir-cache}"
    securityContext:
      runAsUser: ${APP_UID:-1000}
      runAsGroup: ${APP_GID:-1000}
  repository:
    kind: ClusterRepository
    name: local
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  staging:
    # miroir-local (1 replica), NOT the replicated class. kopiur otherwise
    # inherits a class whose clone needs a second leg, and DRBD fills that leg
    # over the network before the mover can use it -- churn on every backup for
    # a volume discarded two minutes later. Worse, kopiur tears the clone down
    # while that resync is still running, and on 2026-09-01 `drbdsetup down`
    # hit the LINBIT/drbd#137 put_ldev refcount underflow doing exactly that:
    # icarus003's storage stack froze, the agent stopped probing for six hours,
    # every CSI CreateSnapshot hung, 314 backups failed.
    #
    # A single-leg clone is placed by shrinkPin on the node the scheduler
    # selected, provided that node holds a complete snapshot leg -- and since
    # the app volumes carry a leg on all three nodes, every node qualifies. So
    # the clone lands wherever the mover does, seeds locally from the snapshot,
    # and comes up UpToDate with no network copy and nothing to resync.
    # Verified 2026-09-01: single-leg test clone bound and the mover ran in ~40s
    # with no FailedMount and no Inconsistent state.
    #
    # This reverts b7af1397a/442208d82, which moved staging to the replicated
    # class to escape the placement wedge of 08-31. That wedge is now handled by
    # the app volumes having three legs, not by replicating the clone.
    # eleboucher/homelab -- the only public repo running miroir with kopiur --
    # stages on miroir-local for the same reason.
    storageClassName: miroir-local
    # Concurrent DRBD lockstep snapshots (or a post-reboot resync) can exceed
    # the 10m default and fail the whole backup.
    timeout: 30m
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:-miroir}"
