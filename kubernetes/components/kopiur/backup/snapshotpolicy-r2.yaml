---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}-r2"
spec:
  # Offsite copy on R2. `local` is the restore path; this is the copy that
  # survives losing the UNAS. Deliberately a separate kopia repository rather
  # than a replica of `local`, so corruption cannot propagate between them.
  compression:
    compressor: zstd
  mover:
    # Ephemeral, NOT Persistent: a persistent cache is a node-local PVC that
    # binds once and pins the mover to that node forever. That broke backups
    # twice on 2026-08-30 -- 80 caches stranded when icarus003 went down, then
    # hermes deadlocked with its cache on icarus003 and its staging clone on
    # icarus001, so no node could satisfy both. Staging clones can only land on
    # diskful nodes; caches can land anywhere, so the two drift apart.
    # Costs a kopia metadata re-download per run; over the LAN that is cheap
    # next to a backup that cannot schedule at all.
    cache:
      # openebs-hostpath, NOT a miroir class: the cache must not be a DRBD
      # volume. It is per-run scratch that exactly one mover pod reads, so
      # replication buys nothing, and every DRBD volume created here is one more
      # that has to be torn down an hour later. Teardown is what wedged icarus003
      # on 2026-09-01: `drbdsetup down` hit the LINBIT/drbd#137 put_ldev refcount
      # underflow while tearing down a staging clone, the node's storage stack
      # froze, and every CSI CreateSnapshot hung for six hours (314 failed
      # backups). Keeping caches off DRBD halves the create/teardown cycles per
      # backup, and with them the exposure.
      #
      # The note that used to be here argued the opposite -- that the cache had
      # to sit on the same driver as the staging clone, or the two would land on
      # different nodes and the mover would be unschedulable. That held while
      # clones were pinned to their replicas' nodes. It stopped being true when
      # clones moved to the replicated class: allowRemoteVolumeAccess defaults on
      # for replicas > 1, so a clone's PV carries no node affinity and a mover on
      # a node without a leg attaches a diskless client leg instead. The cache
      # can land anywhere and the clone follows it.
      capacity: "${KOPIUR_CACHE_CAPACITY:-5Gi}"
      mode: Ephemeral
      storageClassName: "${KOPIUR_CACHE_SNAPSHOTCLASS:-openebs-hostpath}"
    securityContext:
      runAsUser: ${APP_UID:-1000}
      runAsGroup: ${APP_GID:-1000}
  repository:
    kind: ClusterRepository
    name: r2
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  staging:
    # miroir (2 replicas), NOT miroir-local (1). A single-replica staging clone
    # is pinned to exactly one node and usable only while that one replica is
    # UpToDate, which broke every backup on 2026-08-31 two different ways:
    #
    #   - the clone and the mover's kopia cache are provisioned independently
    #     and landed on different nodes (clone icarus003, cache icarus002), so
    #     no node satisfied both and the mover was unschedulable forever with
    #     "3 node(s) didn't match PersistentVolume's node affinity"
    #   - the one mover that did schedule failed to mount with "volume ... is
    #     Inconsistent on node icarus002 (want UpToDate)", the clone's only
    #     replica not yet synced
    #
    # Neither is a kopiur scheduling problem: sourceColocation Required cannot
    # resolve a WaitForFirstConsumer clone's node, Disabled changed nothing, and
    # miroir does honour WaitForFirstConsumer. Two legs give the mover two
    # candidate nodes and a second UpToDate replica to attach.
    #
    # This reverses the note added on 2026-08-29 arguing staging needs no
    # replication. That note was about the chart default of 3 replicas, where
    # every clone touched all three nodes so one degraded node failed the whole
    # fleet, and the per-snapshot LVM/DRBD work drove the icarus003 agent OOM.
    # 2 replicas keeps a spare leg without putting every clone on every node --
    # watch agent memory on the first few nightly waves.
    storageClassName: miroir
    # Concurrent DRBD lockstep snapshots (or a post-reboot resync) can exceed
    # the 10m default and fail the whole backup.
    timeout: 30m
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:-miroir}"
