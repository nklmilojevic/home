---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: "${APP}-local"
spec:
  policyRef:
    name: "${APP}-local"
  schedule:
    # Hash-spread across the hour: `H` is Jenkins-style substitution, so each
    # schedule gets a stable minute derived from its own identity and the 46
    # apps land ~1/minute instead of all at :30.
    #
    # kopiur has no mover-concurrency cap — `moverDefaults.throttle` is a
    # per-mover kopia I/O rate limit, `reconcileConcurrency` bounds reconciles
    # rather than running mover Jobs, and `maxConcurrentDeleteJobs` covers only
    # delete batches — so an unstaggered cron really does fire all 46 CSI
    # snapshot + clone + mover cycles at once. That burst drove an OSD into
    # BlueStore slow ops under volsync on 2026-08-29, and on 2026-08-31 it
    # stranded enough host commands in uninterruptible sleep to trip
    # MiroirNodeStorageWedged on icarus002 (42 concurrent movers, all pinned
    # there, while it was also resync source for the fleet). Snapshots and
    # unmounts then fail node-wide until the agent is restarted.
    #
    # Avoids :00 as a side effect, which matters because the r2 wave is at 03:00.
    cron: "H * * * *"
    timezone: Europe/Belgrade
