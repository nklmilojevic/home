---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: "${APP}-local"
spec:
  policyRef:
    name: "${APP}-local"
  schedule:
    # Every app on the hour, unstaggered. Note that kopiur has no
    # mover-concurrency cap: `moverDefaults.throttle` is a per-mover kopia I/O
    # rate limit, `reconcileConcurrency` bounds reconciles rather than running
    # mover Jobs, and `maxConcurrentDeleteJobs` covers only delete batches. So
    # all sources fire their CSI snapshot + clone + mover cycle at once — the
    # same burst that drove an OSD into BlueStore slow ops under volsync on
    # 2026-08-29. Re-introduce `H * * * *` to hash-spread across the hour if
    # that recurs.
    cron: "0 * * * *"
    timezone: Europe/Belgrade
